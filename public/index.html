<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>منصّة الدروس</title>
<style>
:root{--bg:#f5f5f1;--surface:#fff;--border:#e3e1d9;--navy:#1e3a5f;--navy2:#152b47;--soft:#eaf0f6;--amber:#c98a3e;--green:#2f8f5b;--greenSoft:#e7f4ed;--red:#c4453b;--redSoft:#fbeae9;--text:#23282e;--muted:#6b7280;--shadow:0 10px 30px #1e3a5f12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh;display:flex}.side{width:250px;background:var(--navy);color:#fff;padding:22px 14px;flex-shrink:0}.brand{padding:4px 10px 22px}.brand b{display:block;font-size:20px}.brand small{color:#c5d2df;font-size:12px;display:block;margin-top:6px}.nav button{display:flex;width:100%;border:0;background:transparent;color:#d6dfeb;padding:12px;border-radius:10px;gap:10px;align-items:center;text-align:right;margin:3px 0}.nav button.active,.nav button:hover{background:#ffffff1d;color:#fff}.nav .i{width:24px;text-align:center}.main{flex:1;padding:28px;min-width:0}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px}.title h1{margin:0;font-size:26px}.title p{margin:6px 0 0;color:var(--muted)}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700}.primary{background:var(--navy);color:#fff}.secondary{background:#fff;border:1px solid var(--border)}.danger{background:var(--red);color:#fff}.success{background:var(--green);color:#fff}.warn{background:#f6ead7;color:#7a4e17}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.click-card{width:100%;border:1px solid var(--border);background:#fff;border-radius:12px;padding:18px;text-align:right;box-shadow:var(--shadow)}.click-card:hover{transform:translateY(-2px)}.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:var(--shadow)}.stat{display:flex;align-items:center;gap:12px}.big{font-size:25px;font-weight:800}.muted{font-size:13px;color:var(--muted)}.hero{background:linear-gradient(135deg,var(--navy),#2d557d);color:#fff;border-radius:16px;padding:24px;margin-bottom:18px}.hero h2{margin:0 0 6px}.hero p{margin:0;color:#deebf7;line-height:1.8}.section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center}.road{display:flex;align-items:center;width:100%;border:0;background:#fff;border-top:1px solid var(--border);padding:14px 0;gap:12px;text-align:right}.num{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800}.num.on{background:var(--navy);color:#fff}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.filters input,.filters select,.field input,.field select,.field textarea{background:#fbfbf9;border:1px solid var(--border);border-radius:8px;padding:10px;width:100%;outline:none}.filters input{width:320px}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-weight:700;font-size:13px;margin-bottom:6px}.table-wrap{padding:0;overflow:auto}.table{border-collapse:collapse;width:100%;min-width:700px}.table th,.table td{padding:12px 14px;border-bottom:1px solid var(--border);text-align:right}.table th{font-size:12px;color:var(--muted);background:#fafafa}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800}.badge.green{background:var(--greenSoft);color:var(--green)}.badge.red{background:var(--redSoft);color:var(--red)}.empty{padding:36px;text-align:center;color:var(--muted)}.notice{background:#fff7e8;border:1px solid #edd2a6;color:#7a4e17;line-height:1.8}.modal-bg{position:fixed;inset:0;background:#10151b8c;z-index:50;display:flex;align-items:center;justify-content:center;padding:15px}.modal{background:#fff;border-radius:16px;width:min(700px,100%);max-height:94vh;overflow:auto;padding:20px}.modal.game{width:min(1200px,100%);height:94vh}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.close{border:0;background:transparent;font-size:24px}.game-frame{width:100%;height:calc(100% - 45px);border:1px solid var(--border);border-radius:10px;background:#fff}.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#eef2f6,#f5f5f1)}.login{width:min(920px,100%);display:grid;grid-template-columns:1fr 1fr;gap:18px}.login-info{background:var(--navy);color:#fff;border-radius:16px;padding:28px}.login-info h1{margin-top:0}.login-form{background:#fff;border:1px solid var(--border);border-radius:16px;padding:28px}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1}.tabs .active{background:var(--navy);color:#fff}.credentials{background:var(--greenSoft);border:1px solid #bfe0cd;color:#205f3d;padding:12px;border-radius:10px;margin-top:10px}.link-btn{display:inline-block;padding:7px 10px;background:var(--soft);color:var(--navy);border-radius:8px;text-decoration:none;font-weight:700;font-size:12px}.privacy{color:var(--muted);font-size:12px;line-height:1.8}.progress{height:9px;background:#edf1f5;border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--green);border-radius:999px}.timeline{position:relative;margin:0;padding:0;list-style:none}.timeline li{padding:12px 0;border-bottom:1px solid var(--border);display:grid;grid-template-columns:140px 1fr;gap:12px}.timeline li:last-child{border-bottom:0}.timeline .time{color:var(--muted);font-size:12px}.activity-type{display:inline-flex;padding:4px 7px;border-radius:999px;background:var(--soft);color:var(--navy);font-size:11px;font-weight:800;margin-left:6px}.video-player{width:100%;max-height:68vh;background:#000;border-radius:10px}.tracking-box{background:#fafafa;border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:10px}.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.mini-box{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px}.mini-box b{display:block;font-size:18px}.mini-box span{font-size:12px;color:var(--muted)}.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--navy);font-size:12px;font-weight:700}@media(max-width:900px){.side{width:200px}.main{padding:18px}.login{grid-template-columns:1fr}.filters input{width:100%}}@media(max-width:650px){.app{display:block}.side{width:100%;padding:10px}.brand{display:none}.nav{display:flex;overflow:auto}.nav button{min-width:max-content;width:auto}.main{padding:14px}.top{flex-direction:column}.grid{grid-template-columns:1fr}.table{min-width:620px}}
</style>
</head>
<body><div id="app"></div>
<script>
const API='';let token=localStorage.getItem('edu_token')||'';let user=null;let data=null;let loginRole='teacher';let selectedStudent=null;let activeGame=null;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(path,opts={}){opts.headers={...(opts.headers||{}),'Content-Type':'application/json'};if(token)opts.headers.Authorization='Bearer '+token;const r=await fetch(API+path,opts);const j=await r.json().catch(()=>({}));if(r.status===401){logout();throw new Error(j.error||'انتهت الجلسة')}if(!r.ok)throw new Error(j.error||'حدث خطأ');return j}
function setToken(t,u){token=t;user=u;localStorage.setItem('edu_token',t)}
async function boot(){if(token){try{const m=await api('/api/me');user=m.user;await renderRole()}catch{renderLogin()}}else renderLogin()}
function renderLogin(){document.title='تسجيل الدخول | منصّة الدروس';$('app').innerHTML=`<div class="login-wrap"><div class="login"><div class="login-info"><h1>منصّة الدروس</h1><p>منصة تعليمية لإدارة الطلاب والصفوف والفيديوهات والألعاب التعليمية والنتائج.</p><ul><li>دخول مستقل للمعلم والطالب وولي الأمر</li><li>تشغيل ألعاب HTML داخل المنصة</li><li>حفظ النتائج وربطها بالطالب</li><li>إشعارات واتساب لولي الأمر</li></ul></div><div class="login-form"><div class="tabs"><button class="btn ${loginRole==='teacher'?'active':''} ${loginRole==='teacher'?'primary':'secondary'}" onclick="loginRole='teacher';renderLogin()">المعلم</button><button class="btn ${loginRole==='student'?'active':''} ${loginRole==='student'?'primary':'secondary'}" onclick="loginRole='student';renderLogin()">الطالب</button><button class="btn ${loginRole==='parent'?'active':''} ${loginRole==='parent'?'primary':'secondary'}" onclick="loginRole='parent';renderLogin()">ولي الأمر</button></div><div class="field"><label>${loginRole==='teacher'?'اسم المستخدم':loginRole==='student'?'اسم دخول الطالب':'كود ولي الأمر'}</label><input id="username" autocomplete="username" placeholder="أدخل بيانات الدخول"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور"></div><button class="btn primary" style="width:100%" onclick="doLogin()">دخول</button><p id="loginErr" class="privacy" style="color:var(--red)"></p></div></div></div>`}
async function doLogin(){try{const j=await api('/api/login',{method:'POST',body:JSON.stringify({role:loginRole,username:$('username').value,password:$('password').value})});setToken(j.token,j.user);await renderRole()}catch(e){$('loginErr').textContent=e.message}}
async function logout(){try{if(user?.role==='student')await api('/api/activity',{method:'POST',body:JSON.stringify({type:'logout',entityType:'session',title:'خروج الطالب',details:'تم تسجيل الخروج'})})}catch{}token='';user=null;localStorage.removeItem('edu_token');renderLogin()}
async function renderRole(){if(user.role==='teacher')return teacherApp();if(user.role==='student')return studentApp();return parentApp()}
async function teacherApp(){const j=await api('/api/teacher/dashboard');data=j;renderTeacher('dashboard')}
function shell(active,body){return `<div class="app"><aside class="side"><div class="brand"><b>${esc(data?.settings?.schoolName||'منصّة الدروس')}</b><small>لوحة المعلم والإدارة</small></div><div class="nav">${[['dashboard','⌂','لوحة التحكم'],['classes','🎓','الصفوف'],['students','👥','الطلاب'],['videos','▶','الفيديوهات'],['games','🎮','الألعاب التعليمية'],['grades','🏆','الدرجات'],['activity','📝','متابعة النشاط'],['reports','▤','التقارير'],['settings','⚙','الإعدادات']].map(n=>`<button class="${active===n[0]?'active':''}" onclick="renderTeacher('${n[0]}')"><span class="i">${n[1]}</span><span>${n[2]}</span></button>`).join('')}<button onclick="logout()"><span class="i">↩</span><span>خروج</span></button></div></aside><main class="main">${body}</main></div>`}
function teacherHeader(t,p,act=''){return `<div class="top"><div class="title"><h1>${t}</h1><p>${p}</p></div><div class="top-actions">${act}</div></div>`}
function renderTeacher(page){document.title=page==='dashboard'?'لوحة التحكم':'منصّة الدروس';if(page==='dashboard')$('app').innerHTML=shell(page,dashboardView());if(page==='classes')$('app').innerHTML=shell(page,classesView());if(page==='students')$('app').innerHTML=shell(page,studentsView());if(page==='videos')$('app').innerHTML=shell(page,videosView());if(page==='games')$('app').innerHTML=shell(page,gamesView());if(page==='grades')$('app').innerHTML=shell(page,gradesView());if(page==='activity')$('app').innerHTML=shell(page,activityView());if(page==='reports')$('app').innerHTML=shell(page,reportsView());if(page==='settings')$('app').innerHTML=shell(page,settingsView())}
function statCard(label,val,icon,page){return `<button class="click-card" onclick="renderTeacher('${page}')"><div class="stat"><div style="font-size:28px">${icon}</div><div><div class="big">${esc(val)}</div><div class="muted">${esc(label)}</div></div><span style="margin-right:auto">‹</span></div></button>`}
function portalStat(label,val,icon){return `<div class="click-card" style="cursor:default"><div class="stat"><div style="font-size:28px">${icon}</div><div><div class="big">${esc(val)}</div><div class="muted">${esc(label)}</div></div></div></div>`}
function dashboardView(){const avg=data.results.length?Math.round(data.results.reduce((a,b)=>a+b.percentage,0)/data.results.length):0;return teacherHeader('لوحة التحكم','إدارة كاملة للطلاب والألعاب والنتائج')+`<div class="hero"><h2>المنصة جاهزة للعمل</h2><p>أنشئ الصفوف، أضف الطلاب، ارفع ألعاب HTML، ثم اجعل الطالب يدخل بحسابه. عند انتهاء اللعبة تُحفظ النتيجة باسم الطالب ويمكن إرسالها لولي الأمر.</p></div><div class="grid">${statCard('الصفوف',data.classes.length,'🎓','classes')}${statCard('الطلاب',data.students.length,'👥','students')}${statCard('الألعاب',data.games.length,'🎮','games')}${statCard('متوسط النتائج',avg+'%','🏆','grades')}${statCard('سجل أنشطة الطلاب',data.activity?.length||0,'📝','activity')}</div><div class="section card"><div class="section-head"><h2>بدء الاستخدام</h2><span class="badge green">جاهز</span></div>${[['classes','1','أنشئ الصف الدراسي'],['students','2','أضف الطالب ورقم ولي الأمر'],['games','3','ارفع لعبة HTML'],['grades','4','تابع النتائج والإشعارات']].map(x=>`<button class="road" onclick="renderTeacher('${x[0]}')"><span class="num">${x[1]}</span><span><b>${x[2]}</b><br><span class="muted">اضغط للانتقال</span></span><span style="margin-right:auto">‹</span></button>`).join('')}</div>`}
function classesView(){return teacherHeader('الصفوف','إنشاء الصفوف والمواد',`<button class="btn primary" onclick="classModal()">＋ صف جديد</button>`)+`<div class="card table-wrap"><table class="table"><tr><th>الصف</th><th>المادة</th><th>الطلاب</th><th>إجراءات</th></tr>${data.classes.length?data.classes.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.subject||'—')}</td><td>${data.students.filter(s=>s.classId===c.id).length}</td><td><div class="row"><button class="btn secondary" onclick="classModal('${c.id}')">تعديل</button><button class="btn danger" onclick="deleteClass('${c.id}')">حذف</button></div></td></tr>`).join(''):`<tr><td colspan="4"><div class="empty">لا توجد صفوف بعد.</div></td></tr>`}</table></div>`}
function studentsView(){return teacherHeader('الطلاب','إدارة حسابات الطلاب وبيانات أولياء الأمور',`<button class="btn primary" onclick="studentModal()" ${data.classes.length?'':'disabled'}>＋ طالب جديد</button>`)+`<div class="card table-wrap"><table class="table"><tr><th>الطالب</th><th>الحساب</th><th>الصف</th><th>ولي الأمر</th><th>الصلاحيات</th><th>إجراءات</th></tr>${data.students.length?data.students.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td dir="ltr">${esc(s.username)}</td><td>${esc(data.classes.find(c=>c.id===s.classId)?.name||'—')}</td><td dir="ltr">${esc(s.parentPhone||'—')}<br><span class="muted">${esc(s.parentCode||'')}</span></td><td><div class="row"><button class="btn ${s.permissions?.video?'success':'danger'}" onclick="perm('${s.id}','video')">فيديو</button><button class="btn ${s.permissions?.game?'success':'danger'}" onclick="perm('${s.id}','game')">لعبة</button></div></td><td><div class="row"><button class="btn secondary" onclick="studentModal('${s.id}')">تعديل</button><button class="btn warn" onclick="showCredentials('${s.id}')">بيانات الدخول</button><button class="btn danger" onclick="deleteStudent('${s.id}')">حذف</button></div></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty">لا يوجد طلاب.</div></td></tr>`}</table></div>`}
function videosView(){return teacherHeader('الفيديوهات','إدارة روابط الدروس ومراجعة متابعة المشاهدة',`<button class="btn primary" onclick="videoModal()">＋ فيديو جديد</button>`)+`<div class="card table-wrap"><table class="table"><tr><th>الفيديو</th><th>الصف</th><th>مدة الفيديو</th><th>متابعة</th><th>إجراءات</th></tr>${(data.videos||[]).length?(data.videos||[]).map(v=>{const ps=(data.videoProgress||[]).filter(p=>p.videoId===v.id);const avg=ps.length?Math.round(ps.reduce((a,p)=>a+(p.percent||0),0)/ps.length):0;return `<tr><td><b>${esc(v.title)}</b><br><span class="muted">${esc(v.description||'')}</span></td><td>${esc(data.classes.find(c=>c.id===v.classId)?.name||'—')}</td><td>${formatSec(v.durationSec||0)}</td><td><span class="badge ${avg>=80?'green':''}">${ps.length?avg+'% متوسط':''||'—'}</span></td><td><div class="row"><button class="btn secondary" onclick="previewVideo('${v.id}')">مشاهدة</button><button class="btn secondary" onclick="videoModal('${v.id}')">تعديل</button><button class="btn danger" onclick="deleteVideo('${v.id}')">حذف</button></div></td></tr>`}).join(''):`<tr><td colspan="5"><div class="empty">لا توجد فيديوهات بعد.</div></td></tr>`}</table></div><div class="notice card" style="margin-top:14px">للحصول على تتبع دقيق للمدة المشاهدة، استخدم رابط ملف فيديو مباشر مثل MP4 أو WebM. روابط YouTube والمنصات الخارجية يمكن تسجيل فتحها، لكن لا يمكن للمنصة معرفة زمن تشغيلها بدقة إلا عبر واجهة المنصة الخارجية.</div>`}
function gamesView(){return teacherHeader('الألعاب التعليمية','رفع لعبة HTML وتشغيلها داخل المنصة',`<button class="btn primary" onclick="gameModal()">＋ رفع لعبة HTML</button>`)+`<div class="card table-wrap"><table class="table"><tr><th>اللعبة</th><th>الصف</th><th>الحالة</th><th>إجراءات</th></tr>${data.games.length?data.games.map(g=>`<tr><td><b>${esc(g.title)}</b><br><span class="muted">${esc(g.description||'')}</span></td><td>${esc(data.classes.find(c=>c.id===g.classId)?.name||'—')}</td><td><span class="badge green">تعمل</span></td><td><div class="row"><button class="btn primary" onclick="previewGame('${g.id}')">تشغيل</button><button class="btn secondary" onclick="gameModal('${g.id}')">تعديل</button><button class="btn danger" onclick="deleteGame('${g.id}')">حذف</button></div></td></tr>`).join(''):`<tr><td colspan="4"><div class="empty">لم ترفع ألعاب بعد.</div></td></tr>`}</table></div><div class="notice card" style="margin-top:14px"><b>شرط اللعبة:</b> عند انتهاء اللعبة يجب أن ترسل للمنصة: <code>window.parent.postMessage({type:'EDU_GAME_RESULT', score:8, total:10}, '*')</code></div>`}
function gradesView(){return teacherHeader('الدرجات','نتائج الطلاب ومحاولاتهم',`<button class="btn secondary" onclick="exportData()">⬇ تصدير</button>`)+`<div class="card table-wrap"><table class="table"><tr><th>الطالب</th><th>اللعبة</th><th>الدرجة</th><th>النسبة</th><th>التاريخ</th><th>الإشعار</th></tr>${data.results.length?data.results.map(r=>`<tr><td><b>${esc(r.studentName)}</b></td><td>${esc(r.gameTitle)}</td><td>${r.score}/${r.total}</td><td><span class="badge ${r.percentage>=50?'green':'red'}">${r.percentage}%</span></td><td>${new Date(r.createdAt).toLocaleString('ar-EG')}</td><td><button class="btn success" onclick="notify('${r.id}')">${r.notified?'أُرسل':'إرسال واتساب'}</button></td></tr>`).join(''):`<tr><td colspan="6"><div class="empty">لا توجد نتائج بعد.</div></td></tr>`}</table></div>`}
function activityView(){const acts=data.activity||[];const q=window.aq||'';const sid=window.afStudent||'all';const filtered=acts.filter(a=>(!q||(a.studentName||'').includes(q)||(a.title||'').includes(q)||(a.type||'').includes(q))&& (sid==='all'||a.studentId===sid));const rows=(data.videoProgress||[]).filter(p=>sid==='all'||p.studentId===sid);const typeName={login:'دخول الطالب',logout:'خروج الطالب',video_open:'فتح فيديو',video_play:'تشغيل فيديو',video_pause:'إيقاف فيديو',video_progress:'تقدم فيديو',video_seek:'انتقال داخل الفيديو',video_complete:'إكمال فيديو',game_open:'فتح لعبة',game_result:'نتيجة لعبة',page_view:'فتح صفحة',parent_login:'دخول ولي الأمر'};return teacherHeader('متابعة النشاط','سجل تفصيلي لكل ما قام به الطلاب داخل المنصة',`<button class="btn secondary" onclick="exportData()">⬇ تصدير</button>`)+`<div class="filters"><input placeholder="بحث بالطالب أو النشاط" value="${esc(q)}" oninput="window.aq=this.value;renderTeacher('activity')"><select onchange="window.afStudent=this.value;renderTeacher('activity')"><option value="all">كل الطلاب</option>${data.students.map(x=>`<option value="${x.id}" ${sid===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="section card"><div class="section-head"><h2>ملخص مشاهدة الفيديوهات</h2><span class="badge green">${rows.length} سجل</span></div><div class="table-wrap"><table class="table"><tr><th>الطالب</th><th>الفيديو</th><th>المدة</th><th>المشاهدة</th><th>النسبة</th><th>آخر موضع</th><th>الحالة</th><th>آخر متابعة</th></tr>${rows.length?rows.map(p=>`<tr><td><b>${esc(data.students.find(x=>x.id===p.studentId)?.name||'—')}</b></td><td>${esc(p.videoTitle||'—')}</td><td>${formatSec(p.durationSeconds||0)}</td><td>${formatSec(p.watchedSeconds||0)}</td><td><span class="badge ${p.percent>=80?'green':p.percent?'':'red'}">${p.percent||0}%</span></td><td>${formatSec(p.lastPosition||0)}</td><td>${p.completed?'<span class="badge green">مكتمل</span>':'<span class="badge red">غير مكتمل</span>'}</td><td>${p.lastAt?new Date(p.lastAt).toLocaleString('ar-EG'):'—'}</td></tr>`).join(''):`<tr><td colspan="8"><div class="empty">لا توجد مشاهدة مسجلة بعد.</div></td></tr>`}</table></div></div><div class="section card"><div class="section-head"><h2>السجل الزمني الكامل</h2><span class="badge">${filtered.length} نشاط</span></div><div class="table-wrap"><table class="table"><tr><th>التاريخ</th><th>الطالب</th><th>النشاط</th><th>العنصر</th><th>التفاصيل</th><th>التقدم</th></tr>${filtered.length?filtered.map(a=>`<tr><td>${new Date(a.createdAt).toLocaleString('ar-EG')}</td><td><b>${esc(a.studentName||data.students.find(x=>x.id===a.studentId)?.name||'—')}</b></td><td><span class="activity-type">${esc(typeName[a.type]||a.type)}</span></td><td>${esc(a.title||'—')}</td><td>${esc(a.details||'—')}</td><td>${a.duration?`${formatSec(a.position||0)} / ${formatSec(a.duration)} ${a.percent!=null?' · '+a.percent+'%':''}`:'—'}</td></tr>`).join(''):`<tr><td colspan="6"><div class="empty">لا توجد أنشطة مسجلة بعد.</div></td></tr>`}</table></div></div>`}
function formatSec(sec){sec=Number(sec)||0;if(sec<60)return '00:'+String(Math.floor(sec)).padStart(2,'0');const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=Math.floor(sec%60);return (h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function videoProgressFor(videoId,studentId){return (data.videoProgress||[]).find(p=>p.videoId===videoId&&(!studentId||p.studentId===studentId))||null}
function previewVideo(id){const v=data.videos.find(x=>x.id===id);if(!v)return;openVideo(v,null)}

function reportsView(){const avg=data.results.length?Math.round(data.results.reduce((a,b)=>a+b.percentage,0)/data.results.length):0;return teacherHeader('التقارير','مؤشرات مختصرة قابلة للتصدير')+`<div class="grid">${statCard('عدد المحاولات',data.results.length,'🧮','grades')}${statCard('متوسط النسبة',avg+'%','📈','grades')}${statCard('الطلاب',data.students.length,'👥','students')}${statCard('الألعاب',data.games.length,'🎮','games')}</div><div class="section card"><button class="btn primary" onclick="exportData()">⬇ تنزيل نسخة احتياطية JSON</button><input id="importFile" class="hidden" type="file" accept="application/json" onchange="importData(this)"><button class="btn secondary" onclick="$('importFile').click()">⬆ استيراد نسخة</button></div>`}
function settingsView(){return teacherHeader('الإعدادات','إعدادات المنصة والنسخ الاحتياطية')+`<div class="card"><div class="field"><label>اسم المستخدم الحالي للمعلم</label><input value="${esc(user?.username||'')}" readonly></div><div class="field"><label>اسم المنصة</label><input id="schoolName" value="${esc(data.settings.schoolName||'منصّة الدروس')}"></div><button class="btn primary" onclick="saveSettings()">حفظ الإعدادات</button><div style="height:1px;background:var(--border);margin:18px 0"></div><div class="field"><label>تغيير كلمة مرور المعلم</label><input id="newAdminPassword" type="password" autocomplete="new-password" placeholder="كلمة مرور جديدة"></div><button class="btn secondary" onclick="changeAdminPassword()">تغيير كلمة المرور</button><p class="privacy">بعد التغيير استخدم كلمة المرور الجديدة في تسجيل الدخول القادم. كلمة المرور لا تُعرض في الواجهة.</p><p class="privacy">الإرسال الآلي الحقيقي لواتساب يتطلب تشغيل الخادم بمتغيرات WHATSAPP_TOKEN و WHATSAPP_PHONE_NUMBER_ID. بدونها، ستظهر رسالة واتساب جاهزة لفتحها وإرسالها.</p><button class="btn danger" onclick="resetWarning()">شرح إعادة الضبط</button></div>`}

function classModal(id){const c=id?data.classes.find(x=>x.id===id):{name:'',subject:''};const bg=modal(`<div class="modal-head"><h2>${id?'تعديل الصف':'صف جديد'}</h2><button class="close" onclick="this.closest('.modal-bg').remove()">×</button></div><div class="field"><label>اسم الصف</label><input id="mName" value="${esc(c.name)}"></div><div class="field"><label>المادة</label><input id="mSubject" value="${esc(c.subject||'')}"></div><div class="row"><button class="btn primary" id="save">حفظ</button><button class="btn secondary" onclick="this.closest('.modal-bg').remove()">إلغاء</button></div>`);bg.querySelector('#save').onclick=async()=>{try{const b={name:$('mName').value,subject:$('mSubject').value};await api(id?'/api/classes/'+id:'/api/classes',{method:id?'PUT':'POST',body:JSON.stringify(b)});bg.remove();await teacherApp()}catch(e){alert(e.message)}}}
function studentModal(id){const s=id?data.students.find(x=>x.id===id):{name:'',username:'',classId:data.classes[0]?.id||'',phone:'',parentName:'',parentPhone:''};const bg=modal(`<div class="modal-head"><h2>${id?'تعديل الطالب':'طالب جديد'}</h2><button class="close" onclick="this.closest('.modal-bg').remove()">×</button></div><div class="field"><label>اسم الطالب</label><input id="mName" value="${esc(s.name)}"></div><div class="field"><label>اسم دخول الطالب ${id?'':'(يُنشأ تلقائياً عند تركه فارغاً)'}</label><input id="mUsername" value="${esc(s.username||'')}"></div><div class="field"><label>كلمة مرور الطالب ${id?'(اتركها كما هي دون تغيير)':'(اتركها فارغة للتوليد التلقائي)'}</label><input id="mPassword" type="text"></div><div class="field"><label>الصف</label><select id="mClass">${data.classes.map(c=>`<option value="${c.id}" ${c.id===s.classId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>هاتف الطالب</label><input id="mPhone" dir="ltr" value="${esc(s.phone||'')}"></div><div class="field"><label>اسم ولي الأمر</label><input id="mParentName" value="${esc(s.parentName||'')}"></div><div class="field"><label>رقم ولي الأمر</label><input id="mParentPhone" dir="ltr" value="${esc(s.parentPhone||'')}"></div><div class="field"><label>كلمة مرور ولي الأمر ${id?'(اختياري)':'(اتركها فارغة للتوليد)'}</label><input id="mParentPassword" type="text"></div><div class="row"><button class="btn primary" id="save">حفظ</button><button class="btn secondary" onclick="this.closest('.modal-bg').remove()">إلغاء</button></div>`);bg.querySelector('#save').onclick=async()=>{try{const b={name:$('mName').value,username:$('mUsername').value,password:$('mPassword').value,classId:$('mClass').value,phone:$('mPhone').value,parentName:$('mParentName').value,parentPhone:$('mParentPhone').value,parentPassword:$('mParentPassword').value};const r=await api(id?'/api/students/'+id:'/api/students',{method:id?'PUT':'POST',body:JSON.stringify(b)});bg.remove();await teacherApp();if(!id&&r.credentials)showCreds(r.credentials)}catch(e){alert(e.message)}}}

function gameModal(id){const g=id?data.games.find(x=>x.id===id):{title:'',classId:data.classes[0]?.id||'',description:''};const bg=modal(`<div class="modal-head"><h2>${id?'تعديل اللعبة':'رفع لعبة HTML'}</h2><button class="close" onclick="this.closest('.modal-bg').remove()">×</button></div><div class="field"><label>اسم اللعبة</label><input id="mTitle" value="${esc(g.title)}"></div><div class="field"><label>الصف</label><select id="mClass">${data.classes.map(c=>`<option value="${c.id}" ${c.id===g.classId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>وصف</label><textarea id="mDesc">${esc(g.description||'')}</textarea></div><div class="field"><label>ملف اللعبة HTML ${id?'(اختياري لاستبدال اللعبة)':'المطلوب'}</label><input id="mFile" type="file" accept=".html,text/html"></div><div class="notice">حجم الملف الأقصى 12MB. اللعبة ستفتح داخل iframe ولا يظهر للطالب زر تنزيل.</div><div class="row"><button class="btn primary" id="save">حفظ</button><button class="btn secondary" onclick="this.closest('.modal-bg').remove()">إلغاء</button></div>`);bg.querySelector('#save').onclick=async()=>{try{const f=$('mFile').files[0];let html='';if(f)html=await f.text();if(!id&&!html)return alert('اختر ملف HTML للعبة');const r=await api(id?'/api/games/'+id:'/api/games',{method:id?'PUT':'POST',body:JSON.stringify({title:$('mTitle').value,classId:$('mClass').value,description:$('mDesc').value,html})});bg.remove();await teacherApp()}catch(e){alert(e.message)}}}

function videoModal(id){const v=id?data.videos.find(x=>x.id===id):{title:'',url:'',classId:data.classes[0]?.id||'',description:''};const bg=modal(`<div class=\"modal-head\"><h2>${id?'تعديل الفيديو':'فيديو جديد'}</h2><button class=\"close\" onclick=\"this.closest('.modal-bg').remove()\">×</button></div><div class=\"field\"><label>عنوان الفيديو</label><input id=\"vTitle\" value=\"${esc(v.title)}\"></div><div class=\"field\"><label>رابط الفيديو</label><input id=\"vUrl\" value=\"${esc(v.url)}\" dir=\"ltr\"></div><div class=\"field\"><label>الصف</label><select id=\"vClass\">${data.classes.map(c=>`<option value=\"${c.id}\" ${c.id===v.classId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class=\"field\"><label>الوصف</label><textarea id=\"vDesc\">${esc(v.description||'')}</textarea></div><div class=\"row\"><button class=\"btn primary\" id=\"save\">حفظ</button><button class=\"btn secondary\" onclick=\"this.closest('.modal-bg').remove()\">إلغاء</button></div>`);bg.querySelector('#save').onclick=async()=>{try{const b={title:$('vTitle').value,url:$('vUrl').value,classId:$('vClass').value,description:$('vDesc').value};if(!b.title||!b.url)return alert('أكمل عنوان الفيديو والرابط');await api(id?'/api/videos/'+id:'/api/videos',{method:id?'PUT':'POST',body:JSON.stringify(b)});bg.remove();await teacherApp()}catch(e){alert(e.message)}}}
async function deleteGame(id){if(!confirm('حذف اللعبة؟'))return;try{await api('/api/games/'+id,{method:'DELETE'});await teacherApp()}catch(e){alert(e.message)}}

async function openGame(g,student){const bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML=`<div class="modal game"><div class="modal-head"><div><b>${esc(g.title)}</b>${student?' · '+esc(student.name):''}</div><button class="close">×</button></div><iframe class="game-frame" id="gameFrame" sandbox="allow-scripts allow-forms allow-modals" src="/game/${g.id}"></iframe></div>`;document.body.appendChild(bg);bg.dataset.gameId=g.id;bg.dataset.studentId=student?.id||'';const close=()=>{bg.remove();window.removeEventListener('message',gameMessage)};bg.querySelector('.close').onclick=close;window.addEventListener('message',gameMessage);if(student&&user?.role==='student'){try{await api('/api/activity',{method:'POST',body:JSON.stringify({type:'game_open',entityType:'game',entityId:g.id,title:g.title,details:'فتح اللعبة التعليمية'})})}catch{}}}
async function gameMessage(e){const bg=document.querySelector('.modal-bg');if(!bg)return;const d=e.data||{};if(d.type!=='EDU_GAME_RESULT')return;const gameId=bg.dataset.gameId,studentId=bg.dataset.studentId;if(!studentId){alert('عرض المعلم فقط. افتح اللعبة من حساب الطالب لتسجيل النتيجة.');return}try{const r=await api('/api/results',{method:'POST',body:JSON.stringify({gameId,studentId,score:d.score,total:d.total})});bg.remove();window.removeEventListener('message',gameMessage);alert(`تم تسجيل النتيجة ${r.result.score}/${r.result.total} — ${r.result.percentage}%${r.whatsapp?.mode==='automatic'?'\nوتم إرسال واتساب لولي الأمر تلقائياً.':'\nتم تجهيز إشعار واتساب لولي الأمر.'}`);if(user.role==='student')studentApp();}catch(err){alert(err.message)}}
function openVideo(v,student){const bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML=`<div class="modal game"><div class="modal-head"><div><b>${esc(v.title)}</b>${student?' · '+esc(student.name):''}</div><button class="close">×</button></div><video class="video-player" id="trackedVideo" controls playsinline preload="metadata" src="${esc(v.url)}"></video><div class="tracking-box"><div class="row" style="justify-content:space-between"><span>مدة المشاهدة</span><b id="watchCounter">00:00 / 00:00</b></div><div class="progress"><span id="watchBar" style="width:0%"></span></div><div id="watchStatus" class="muted" style="margin-top:6px">جاري تحميل مدة الفيديو…</div></div></div>`;document.body.appendChild(bg);const video=bg.querySelector('#trackedVideo');let lastTime=0,lastSent=0,seeked=false,started=false,completed=false,openSent=false;const send=async(event='progress',delta=0)=>{if(!student||user?.role!=='student')return;try{const duration=Number.isFinite(video.duration)?video.duration:0;const position=Number(video.currentTime)||0;const percent=duration?Math.round(position/duration*100):0;await api('/api/videos/'+v.id+'/progress',{method:'POST',body:JSON.stringify({event,position,duration,watchedDelta:delta,completed:event==='complete'||percent>=95})});lastSent=Date.now()}catch{}};const close=()=>{if(student&&user?.role==='student'){const delta=Math.max(0,video.currentTime-lastTime);send(video.ended?'complete':'pause',delta)}bg.remove()};bg.querySelector('.close').onclick=close;video.addEventListener('loadedmetadata',()=>{$('watchStatus').textContent='المدة الكاملة: '+formatSec(video.duration);if(student&&user?.role==='student'&&!openSent){openSent=true;send('open',0)}});video.addEventListener('play',()=>{started=true;send('play',0)});video.addEventListener('pause',()=>{if(!video.ended)send('pause',Math.max(0,video.currentTime-lastTime))});video.addEventListener('seeking',()=>{seeked=true;send('seek',0)});video.addEventListener('seeked',()=>{lastTime=video.currentTime});video.addEventListener('timeupdate',()=>{const now=video.currentTime;let delta=0;if(!seeked&&started&&now>=lastTime){delta=Math.min(3,Math.max(0,now-lastTime));}seeked=false;lastTime=now;const pct=video.duration?Math.round(now/video.duration*100):0;$('watchCounter').textContent=formatSec(now)+' / '+formatSec(video.duration||0);$('watchBar').style.width=Math.min(100,pct)+'%';if(student&&user?.role==='student'&&delta>0&&Date.now()-lastSent>2500)send('progress',delta)});video.addEventListener('ended',()=>{completed=true;send('complete',Math.max(0,video.currentTime-lastTime));$('watchStatus').textContent='اكتمل الفيديو ✓';});video.addEventListener('error',()=>{$('watchStatus').textContent='تعذر تشغيل هذا الرابط كمقطع فيديو مباشر. استخدم رابط MP4/WebM مباشر.'})}

async function saveSettings(){try{await api('/api/settings',{method:'PATCH',body:JSON.stringify({schoolName:$('schoolName').value.trim()})});await teacherApp()}catch(e){alert(e.message)}}
function resetWarning(){alert('في هذه النسخة لا يوجد زر حذف شامل متاح من الواجهة العامة حتى لا يتم فقدان بيانات الطلاب بالخطأ. استخدم النسخ الاحتياطية قبل أي صيانة.');}
async function studentApp(){const j=await api('/api/student/me');const st=j.student;try{await api('/api/activity',{method:'POST',body:JSON.stringify({type:'page_view',entityType:'student',title:'صفحة الطالب',details:'فتح لوحة الطالب'})})}catch{}const pMap=Object.fromEntries((j.videoProgress||[]).map(p=>[p.videoId,p]));$('app').innerHTML=`<div class="app"><aside class="side"><div class="brand"><b>منصّة الدروس</b><small>حساب الطالب</small></div><div class="nav"><button class="active"><span class="i">🎮</span><span>محتوى الطالب</span></button><button onclick="logout()"><span class="i">↩</span><span>خروج</span></button></div></aside><main class="main">${teacherHeader('مرحباً '+esc(st.name),'الصف: '+esc(j.class.name),`<span class="pill">حساب طالب</span>`)}<div class="hero"><h2>أهلاً ${esc(st.name)} 👋</h2><p>كل مشاهدة ولعبة ونتيجة تُسجل في سجل المتابعة الخاص بك ليستطيع المعلم وولي الأمر متابعة تقدمك.</p></div><div class="grid">${j.games.length?j.games.map(g=>`<button class="click-card" onclick='openGame(${JSON.stringify(g)},${JSON.stringify(st)})'><div class="stat"><div style="font-size:32px">🎮</div><div><b>${esc(g.title)}</b><div class="muted">${esc(g.description||'لعبة تعليمية')}</div></div><span style="margin-right:auto">▶</span></div></button>`).join(''):`<div class="empty card" style="grid-column:1/-1">لا توجد ألعاب متاحة لك حالياً.</div>`}</div><div class="section card"><h2>الفيديوهات المسموح بها</h2>${j.videos?.length?`<div class="grid">${j.videos.map(v=>{const p=pMap[v.id];return `<button class="click-card" onclick='openVideo(${JSON.stringify(v)},${JSON.stringify(st)})' style="text-align:right"><div class="stat"><div style="font-size:30px">▶️</div><div style="flex:1"><b>${esc(v.title)}</b><div class="muted">${esc(v.description||'درس فيديو')}</div>${p?`<div class="tracking-box"><div class="row" style="justify-content:space-between"><span class="muted">المشاهدة</span><b>${p.percent||0}%</b></div><div class="progress"><span style="width:${Math.min(100,p.percent||0)}%"></span></div><div class="muted" style="margin-top:5px">${formatSec(p.watchedSeconds||0)} من ${formatSec(p.durationSeconds||0)} · ${p.completed?'مكتمل':'غير مكتمل'}</div></div>`:`<div class="muted" style="margin-top:5px">لم يبدأ بعد</div>`}</div><span style="margin-right:auto">▶</span></div></button>`}).join('')}</div>`:`<div class="empty">لا توجد فيديوهات متاحة لك حالياً.</div>`}</div><div class="section card"><h2>نتائجي</h2>${j.results.length?`<div class="table-wrap"><table class="table"><tr><th>اللعبة</th><th>الدرجة</th><th>النسبة</th><th>التاريخ</th></tr>${j.results.map(r=>`<tr><td>${esc(r.gameTitle)}</td><td>${r.score}/${r.total}</td><td><span class="badge ${r.percentage>=50?'green':'red'}">${r.percentage}%</span></td><td>${new Date(r.createdAt).toLocaleString('ar-EG')}</td></tr>`).join('')}</table></div>`:`<div class="empty">لم تسجل نتائج بعد.</div>`}</div><div class="section card"><h2>نشاطي الأخير</h2>${j.activity?.length?`<ul class="timeline">${j.activity.slice(0,12).map(a=>`<li><span class="time">${new Date(a.createdAt).toLocaleString('ar-EG')}</span><span><span class="activity-type">${esc(a.type)}</span> ${esc(a.title||'')} ${a.details?'— '+esc(a.details):''}</span></li>`).join('')}</ul>`:`<div class="empty">لا يوجد نشاط مسجل.</div>`}</div></main></div>`}
async function parentApp(){const j=await api('/api/parent/me');const st=j.student;const pMap=Object.fromEntries((j.videoProgress||[]).map(p=>[p.videoId,p]));$('app').innerHTML=`<div class="app"><aside class="side"><div class="brand"><b>منصّة الدروس</b><small>متابعة ولي الأمر</small></div><div class="nav"><button class="active"><span class="i">📊</span><span>متابعة الطالب</span></button><button onclick="logout()"><span class="i">↩</span><span>خروج</span></button></div></aside><main class="main">${teacherHeader('متابعة الطالب','اسم الطالب: '+esc(st.name),`<span class="pill">ولي الأمر</span>`)}<div class="grid">${portalStat('عدد المحاولات',j.results.length,'🧮')}${portalStat('آخر نسبة',j.results[0]?.percentage!=null?j.results[0].percentage+'%':'—','🏆')}${portalStat('الألعاب',j.games.length,'🎮')}${portalStat('الأنشطة',j.activity?.length||0,'📝')}</div><div class="section card"><h2>متابعة الفيديوهات</h2>${j.videos?.length?`<div class="grid">${j.videos.map(v=>{const p=pMap[v.id];return `<div class="card"><div class="row" style="justify-content:space-between"><div><b>${esc(v.title)}</b><div class="muted">${esc(v.description||'درس')}</div></div><span class="badge ${p?.completed?'green':''}">${p?.completed?'مكتمل':p?'قيد المتابعة':'لم يبدأ'}</span></div><div class="tracking-box"><div class="stat-grid"><div class="mini-box"><b>${formatSec(p?.watchedSeconds||0)}</b><span>مدة المشاهدة</span></div><div class="mini-box"><b>${formatSec(p?.durationSeconds||0)}</b><span>مدة الفيديو</span></div><div class="mini-box"><b>${p?.percent||0}%</b><span>النسبة</span></div><div class="mini-box"><b>${p?.openCount||0}</b><span>مرات الفتح</span></div></div><div class="progress" style="margin-top:10px"><span style="width:${Math.min(100,p?.percent||0)}%"></span></div><div class="muted" style="margin-top:6px">آخر موضع: ${formatSec(p?.lastPosition||0)} · آخر متابعة: ${p?.lastAt?new Date(p.lastAt).toLocaleString('ar-EG'):'—'}</div></div></div>`}).join('')}</div>`:`<div class="empty">لا توجد فيديوهات مرتبطة بالصف.</div>`}</div><div class="section card"><h2>سجل الألعاب والنتائج</h2>${j.results.length?`<div class="table-wrap"><table class="table"><tr><th>اللعبة</th><th>الدرجة</th><th>النسبة</th><th>التاريخ</th></tr>${j.results.map(r=>`<tr><td>${esc(r.gameTitle)}</td><td>${r.score}/${r.total}</td><td><span class="badge ${r.percentage>=50?'green':'red'}">${r.percentage}%</span></td><td>${new Date(r.createdAt).toLocaleString('ar-EG')}</td></tr>`).join('')}</table></div>`:`<div class="empty">لا توجد نتائج حتى الآن.</div>`}</div><div class="section card"><h2>كل ما قام به الطالب</h2>${j.activity?.length?`<ul class="timeline">${j.activity.map(a=>`<li><span class="time">${new Date(a.createdAt).toLocaleString('ar-EG')}</span><span><span class="activity-type">${esc(a.type)}</span> <b>${esc(a.title||'نشاط')}</b><br><span class="muted">${esc(a.details||'')}</span>${a.duration?`<br><span class="muted">الموضع ${formatSec(a.position||0)} / ${formatSec(a.duration)} ${a.percent!=null?' · '+a.percent+'%':''}</span>`:''}</span></li>`).join('')}</ul>`:`<div class="empty">لا يوجد نشاط مسجل بعد.</div>`}</div></main></div>`}
boot();
</script>
</body></html>

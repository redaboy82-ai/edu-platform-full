<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>منصّة الدروس</title><style>
:root{--bg:#f5f5f1;--surface:#fff;--border:#e3e1d9;--navy:#1e3a5f;--soft:#eaf0f6;--amber:#c98a3e;--green:#2f8f5b;--greenSoft:#e7f4ed;--red:#c4453b;--redSoft:#fbeae9;--text:#23282e;--muted:#6b7280;--shadow:0 10px 30px #1e3a5f12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh;display:flex}.side{width:250px;background:var(--navy);color:#fff;padding:22px 14px;flex-shrink:0}.brand{padding:4px 10px 22px}.brand b{display:block;font-size:20px}.brand small{color:#c5d2df;font-size:12px;display:block;margin-top:6px}.nav button{display:flex;width:100%;border:0;background:transparent;color:#d6dfeb;padding:12px;border-radius:10px;gap:10px;align-items:center;text-align:right;margin:3px 0}.nav button.active,.nav button:hover{background:#ffffff1d;color:#fff}.nav .i{width:24px;text-align:center}.main{flex:1;padding:28px;min-width:0}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px}.title h1{margin:0;font-size:26px}.title p{margin:6px 0 0;color:var(--muted)}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700}.primary{background:var(--navy);color:#fff}.secondary{background:#fff;border:1px solid var(--border)}.danger{background:var(--red);color:#fff}.success{background:var(--green);color:#fff}.warn{background:#f6ead7;color:#7a4e17}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.click-card{width:100%;border:1px solid var(--border);background:#fff;border-radius:12px;padding:18px;text-align:right;box-shadow:var(--shadow)}.click-card:hover{transform:translateY(-2px)}.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:var(--shadow)}.stat{display:flex;align-items:center;gap:12px}.big{font-size:25px;font-weight:800}.muted{font-size:13px;color:var(--muted)}.hero{background:linear-gradient(135deg,var(--navy),#2d557d);color:#fff;border-radius:16px;padding:24px;margin-bottom:18px}.hero h2{margin:0 0 6px}.hero p{margin:0;color:#deebf7;line-height:1.8}.section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center}.road{display:flex;align-items:center;width:100%;border:0;background:#fff;border-top:1px solid var(--border);padding:14px 0;gap:12px;text-align:right}.num{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.filters input,.filters select,.field input,.field select,.field textarea{background:#fbfbf9;border:1px solid var(--border);border-radius:8px;padding:10px;width:100%;outline:none}.filters input{width:320px}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-weight:700;font-size:13px;margin-bottom:6px}.table-wrap{padding:0;overflow:auto}.table{border-collapse:collapse;width:100%;min-width:700px}.table th,.table td{padding:12px 14px;border-bottom:1px solid var(--border);text-align:right;vertical-align:top}.table th{font-size:12px;color:var(--muted);background:#fafafa}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800}.badge.green{background:var(--greenSoft);color:var(--green)}.badge.red{background:var(--redSoft);color:var(--red)}.empty{padding:36px;text-align:center;color:var(--muted)}.notice{background:#fff7e8;border:1px solid #edd2a6;color:#7a4e17;line-height:1.8}.modal-bg{position:fixed;inset:0;background:#10151b8c;z-index:50;display:flex;align-items:center;justify-content:center;padding:15px}.modal{background:#fff;border-radius:16px;width:min(900px,100%);max-height:94vh;overflow:auto;padding:20px}.modal.game{width:min(1200px,100%);height:94vh}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.close{border:0;background:transparent;font-size:24px}.modal.game{width:min(1500px,99vw);height:96vh;max-height:96vh;padding:12px}.game-frame{width:100%;height:calc(100% - 45px);border:1px solid var(--border);border-radius:10px;background:#fff}.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#eef2f6,#f5f5f1)}.login{width:min(920px,100%);display:grid;grid-template-columns:1fr 1fr;gap:18px}.login-info{background:var(--navy);color:#fff;border-radius:16px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:520px;overflow:hidden}.login-info h1{margin:0 0 10px;font-size:30px}.login-info p{margin:0}.teacher-photo{width:230px;height:230px;object-fit:cover;border-radius:18px;border:4px solid rgba(255,255,255,.28);box-shadow:0 12px 30px rgba(0,0,0,.22);margin-bottom:18px}.welcome{font-size:22px;font-weight:800;line-height:1.5;margin-bottom:12px}.teacher-phone{display:inline-flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-size:18px;font-weight:700;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.18);padding:9px 14px;border-radius:10px;direction:ltr}.login-form{background:#fff;border:1px solid var(--border);border-radius:16px;padding:28px}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1}.tabs .active{background:var(--navy);color:#fff}.credentials{background:var(--greenSoft);border:1px solid #bfe0cd;color:#205f3d;padding:12px;border-radius:10px;margin-top:10px}.privacy{color:var(--muted);font-size:12px;line-height:1.8}.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--navy);font-size:12px;font-weight:700}.progress-wrap{min-width:150px}.progress{height:8px;background:#eef1f4;border-radius:99px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--green);border-radius:99px}.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.metric{padding:14px;border:1px solid var(--border);border-radius:10px;background:#fbfbf9}.metric b{display:block;font-size:20px}.activity{padding:11px 0;border-bottom:1px solid var(--border)}.activity:last-child{border-bottom:0}.video-box{background:#000;border-radius:12px;overflow:hidden}.video-box video{width:100%;max-height:70vh;display:block}video::-internal-media-controls-download-button{display:none!important}video::-webkit-media-controls-download-button{display:none!important}.secure-media{position:relative}.secure-media video,.secure-media audio{outline:none}.secure-controls{display:flex;align-items:center;gap:8px;background:#111;color:#fff;padding:8px 10px;direction:ltr}.secure-controls button{border:0;background:transparent;color:#fff;font-size:18px;padding:5px 8px;border-radius:6px}.secure-controls button:hover{background:#ffffff22}.secure-progress{flex:1;min-width:80px}.secure-time{font-size:12px;white-space:nowrap;direction:ltr}.secure-volume{width:90px}.secure-full{margin-left:auto}.secure-media audio{width:100%;display:block}.secure-media video{width:100%;max-height:70vh;display:block;background:#000}.audio-box{background:#f7f9fb;border:1px solid var(--border);border-radius:12px;padding:22px}.audio-box audio{width:100%}.question-video{width:100%;max-height:300px;border-radius:10px;margin-top:10px}.note-audio{width:100%;margin-top:10px}.toast-wrap{position:fixed;bottom:16px;left:16px;z-index:80;display:flex;flex-direction:column;gap:10px;width:320px;max-width:92vw}.toast-card{padding:14px}.question-image{max-width:100%;max-height:260px;display:block;margin:10px 0;border-radius:9px}.error-box{background:#fff7f7;border:1px solid #f1caca;padding:12px;border-radius:10px;margin:10px 0}.ok-box{background:var(--greenSoft);border:1px solid #bfe0cd;padding:14px;border-radius:10px;margin:10px 0}.countdown{font-weight:800;color:#7a4e17}.editor-question{background:#fbfbf9;border:1px solid var(--border);border-radius:12px;padding:14px;margin:12px 0}.option-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin:7px 0}.read-only{background:#f4f5f7}.no-select{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.test-stage{min-height:240px}@media(max-width:900px){.side{width:200px}.main{padding:18px}.login{grid-template-columns:1fr}.login-info{min-height:auto}.teacher-photo{width:190px;height:190px}}@media(max-width:650px){.app{display:block}.side{width:100%;padding:10px}.brand{display:none}.nav{display:flex;overflow:auto}.nav button{width:auto;min-width:max-content}.main{padding:14px}.top{flex-direction:column}.grid{grid-template-columns:1fr}.table{min-width:620px}}
</style></head><body><div id="app"></div><script>
function mediaUrl(kind,id){return id?`/${kind}-stream/${encodeURIComponent(id)}?token=${encodeURIComponent(token)}`:''}
const API='';let token=localStorage.getItem('edu_token')||'',user=null,data=null,loginRole='teacher',testDraft=[];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function googleDriveFileId(value){const s=String(value||'').trim();let m=s.match(/\/file\/d\/([A-Za-z0-9_-]+)/i);if(m)return m[1];m=s.match(/[?&]id=([A-Za-z0-9_-]+)/i);if(m)return m[1];m=s.match(/\/d\/([A-Za-z0-9_-]+)/i);return m?m[1]:''}
function contentMediaUrl(kind,item,studentId=''){if(!item)return '';const q=`?token=${encodeURIComponent(token)}${studentId?`&studentId=${encodeURIComponent(studentId)}`:''}`;if(item.sourceType==='telegram')return `/telegram-stream/${encodeURIComponent(kind)}/${encodeURIComponent(item.id)}${q}`;if(item.sourceType==='drive')return `/drive-stream/${encodeURIComponent(kind)}/${encodeURIComponent(item.id)}${q}`;if(kind==='game')return `/game/${encodeURIComponent(item.id)}?token=${encodeURIComponent(token)}`;if(item.sourceType==='upload')return `/${kind==='document'?'document':kind}-stream/${encodeURIComponent(item.id)}${q}`;return item.url||''}
function imageSrc(v,testId=''){const x=String(v||'');if(/^tg:/i.test(x))return `/telegram-question-media/${encodeURIComponent(testId)}/${encodeURIComponent(x.slice(3))}?token=${encodeURIComponent(token)}`;if(x.startsWith('/telegram-question-media/'))return x+(x.includes('?')?'&':'?')+'token='+encodeURIComponent(token);return x;}
async function api(p,o={}){o.headers={...(o.headers||{})};if(!(o.body instanceof FormData))o.headers['Content-Type']='application/json';if(token)o.headers.Authorization='Bearer '+token;const r=await fetch(API+p,o),j=await r.json().catch(()=>({}));if(r.status===401){logout();throw Error(j.error||'انتهت الجلسة')}if(!r.ok)throw Error(j.error||'حدث خطأ');return j}
function fmtSec(n){n=Math.max(0,Math.round(Number(n||0)));const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return h?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0}
function setToken(t,u){token=t;user=u;localStorage.setItem('edu_token',t)}function logout(){token='';user=null;localStorage.removeItem('edu_token');renderLogin()}
async function boot(){if(token){try{const m=await api('/api/me');user=m.user;return renderRole()}catch{}}renderLogin()}
function renderLogin(){$('app').innerHTML=`<div class="login-wrap"><div class="login"><div class="login-info"><img class="teacher-photo" src="/teacher-photo.jpeg" alt="مستر رضا عوض"><div class="welcome">مرحبا بكم فى منصة مستر رضا عوض التعليمية</div><div style="font-size:15px;font-weight:700;margin-bottom:8px;color:#deebf7">للاشتراك فى المنصة تواصل عبر:</div><a class="teacher-phone" href="https://wa.me/201093559477?text=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%D8%8C%20%D8%A3%D8%B1%D8%BA%D8%A8%20%D9%81%D9%8A%20%D8%A7%D9%84%D8%A7%D8%B4%D8%AA%D8%B1%D8%A7%D9%83%20%D9%81%D9%8A%20%D9%85%D9%86%D8%B5%D8%A9%20%D9%85%D8%B3%D8%AA%D8%B1%20%D8%B1%D8%B6%D8%A7%20%D8%B9%D9%88%D8%B6" target="_blank" rel="noopener noreferrer" aria-label="التواصل عبر واتساب">☎ 00201093559477</a></div><div class="login-form"><div class="tabs">${[['teacher','المعلم'],['student','الطالب'],['parent','ولي الأمر']].map(x=>`<button class="btn ${loginRole===x[0]?'primary active':'secondary'}" onclick="loginRole='${x[0]}';renderLogin()">${x[1]}</button>`).join('')}</div><div class="field"><label>${loginRole==='teacher'?'اسم المستخدم':loginRole==='student'?'اسم دخول الطالب':'كود ولي الأمر'}</label><input id="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password"></div><button class="btn primary" style="width:100%" onclick="doLogin()">دخول</button><p id="loginErr" class="privacy" style="color:var(--red)"></p></div></div></div>`}
async function doLogin(){try{const j=await api('/api/login',{method:'POST',body:JSON.stringify({role:loginRole,username:$('username').value,password:$('password').value})});setToken(j.token,j.user);renderRole()}catch(e){$('loginErr').textContent=e.message}}
async function renderRole(){if(user.role==='teacher')return teacherApp();if(user.role==='student')return studentApp();return parentApp()}
async function teacherApp(){data=await api('/api/teacher/dashboard');renderTeacher('dashboard')}
function shell(active,body){return `<div class="app"><aside class="side"><div class="brand"><b>${esc(data?.settings?.schoolName||'منصّة الدروس')}</b><small>لوحة المعلم والإدارة</small></div><div class="nav">${[['dashboard','⌂','لوحة التحكم'],['classes','🎓','الصفوف'],['students','👥','الطلاب'],['videos','▶','الفيديوهات'],['audios','🎧','الصوتيات'],['documents','📚','الكتب والمذكرات'],['games','🎮','الألعاب التعليمية'],['tests','📝','الاختبارات الإلكترونية'],['grades','🏆','الدرجات'],['reports','▤','التقارير'],['settings','⚙','الإعدادات']].map(n=>`<button class="${active===n[0]?'active':''}" onclick="renderTeacher('${n[0]}')"><span class="i">${n[1]}</span><span>${n[2]}</span></button>`).join('')}<button onclick="logout()"><span class="i">↩</span><span>خروج</span></button></div></aside><main class="main">${body}</main></div>`}
function teacherHeader(t,p,a=''){return `<div class="top"><div class="title"><h1>${t}</h1><p>${p}</p></div><div class="top-actions">${a}</div></div>`}
function renderTeacher(p){if(p==='dashboard')$('app').innerHTML=shell(p,dashboardView());if(p==='classes')$('app').innerHTML=shell(p,classesView());if(p==='students')$('app').innerHTML=shell(p,studentsView());if(p==='videos')$('app').innerHTML=shell(p,videosView());if(p==='audios')$('app').innerHTML=shell(p,audiosView());if(p==='documents')$('app').innerHTML=shell(p,documentsView());if(p==='games')$('app').innerHTML=shell(p,gamesView());if(p==='tests')$('app').innerHTML=shell(p,testsView());if(p==='grades')$('app').innerHTML=shell(p,gradesView());if(p==='reports')$('app').innerHTML=shell(p,reportsView());if(p==='settings')$('app').innerHTML=shell(p,settingsView())}
function statCard(label,val,icon,page){return `<button class="click-card" onclick="renderTeacher('${page}')"><div class="stat"><div style="font-size:28px">${icon}</div><div><div class="big">${esc(val)}</div><div class="muted">${label}</div></div><span style="margin-right:auto">‹</span></div></button>`}
function dashboardView(){const rs=data.results.filter(r=>r.resultType==='test'),avg=rs.length?Math.round(rs.reduce((a,b)=>a+b.percentage,0)/rs.length):0;return teacherHeader('لوحة التحكم','إدارة الطلاب والفيديوهات والألعاب والاختبارات')+`<div class="hero"><h2>المنصة جاهزة للعمل</h2><p>الاختبارات أصبحت داخل المنصة بالكامل مع تصحيح تلقائي وإظهار الأخطاء. الألعاب متاحة في أي وقت، والاختبارات تفتح للطالب مباشرة بعد إنشائها.</p></div><div class="grid">${statCard('الصفوف',data.classes.length,'🎓','classes')}${statCard('الطلاب',data.students.length,'👥','students')}${statCard('الألعاب',data.games.length,'🎮','games')}${statCard('الفيديوهات',data.videos.length,'🎥','videos')}${statCard('الصوتيات',data.audios.length,'🎧','audios')}${statCard('الكتب والمذكرات',data.documents?.length||0,'📚','documents')}${statCard('الاختبارات الإلكترونية',data.electronicTests.length,'📝','tests')}${statCard('متوسط نتائج الاختبارات',avg+'%','🏆','grades')}</div><div class="section card"><div class="section-head"><h2>بدء الاستخدام</h2><span class="badge green">جاهز</span></div>${[['classes','1','أنشئ الصف الدراسي'],['students','2','أضف الطالب وولي الأمر'],['games','3','ارفع لعبة HTML'],['videos','4','أضف الفيديوهات'],['audios','5','أضف الصوتيات'],['documents','6','أضف الكتب والمذكرات'],['tests','7','أنشئ الاختبار وحدد الأسئلة'],['grades','8','تابع النتائج والأخطاء']].map(x=>`<button class="road" onclick="renderTeacher('${x[0]}')"><span class="num">${x[1]}</span><span><b>${x[2]}</b><br><span class="muted">اضغط للانتقال</span></span><span style="margin-right:auto">‹</span></button>`).join('')}</div>`}
function classesView(){return teacherHeader('الصفوف','إدارة الصفوف والمواد داخل كل صف',`<button class="btn primary" onclick="classModal()">＋ صف جديد</button>`)+`<div class="card table-wrap"><table class="table"><tr><th>الصف</th><th>المواد</th><th>الطلاب</th><th>إجراءات</th></tr>${data.classes.length?data.classes.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td><div class="row">${(c.subjects||[]).map(x=>`<span class="badge green">${esc(x.name)}</span>`).join('')||'<span class="muted">لا توجد مواد</span>'}</div></td><td>${data.students.filter(s=>s.classId===c.id).length}</td><td><div class="row"><button class="btn secondary" onclick="classModal('${c.id}')">إدارة المواد</button><button class="btn danger" onclick="deleteClass('${c.id}')">حذف</button></div></td></tr>`).join(''):`<tr><td colspan="4"><div class="empty">لا توجد صفوف بعد.</div></td></tr>`}</table></div>`}

function studentLevel(id){const rs=data.results.filter(r=>r.studentId===id&&r.resultType==='test');return rs.length?Math.round(rs.reduce((a,b)=>a+b.percentage,0)/rs.length):null}function levelBadge(v){return v===null?'<span class="muted">لا توجد نتائج</span>':`<span class="badge ${v>=50?'green':'red'}">${v}%</span>`}
function studentsView(){return teacherHeader('الطلاب','إدارة حسابات الطلاب وبيانات أولياء الأمور',`<button class="btn primary" onclick="studentModal()" ${data.classes.length?'':'disabled'}>＋ طالب جديد</button>`)+`<div class="card notice" style="margin-bottom:14px"><b>حسابات أولياء الأمور:</b> ${(data.parents||[]).length} حساب، ويمكن لكل حساب متابعة جميع الأبناء المرتبطين به من تسجيل دخول واحد.</div><div class="card table-wrap"><table class="table"><tr><th>الطالب</th><th>الحساب</th><th>الصف</th><th>المواد المتاحة</th><th>ولي الأمر</th><th>اختبارات</th><th>الصلاحيات</th><th>إجراءات</th></tr>${data.students.length?data.students.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td dir="ltr">${esc(s.username)}</td><td>${esc(data.classes.find(c=>c.id===s.classId)?.name||'—')}</td><td><div class="row">${(s.subjectIds||[]).map(id=>data.classes.find(c=>c.id===s.classId)?.subjects?.find(x=>x.id===id)?.name).filter(Boolean).map(n=>`<span class="badge green">${esc(n)}</span>`).join('')||'<span class="muted">لا توجد مواد</span>'}</div></td><td dir="ltr">${esc(s.parentPhone||'—')}<br><span class="muted">${esc(s.parentCode||'')}</span></td><td>${levelBadge(studentLevel(s.id))}</td><td><div class="row"><button class="btn ${s.permissions?.video?'success':'danger'}" onclick="perm('${s.id}','video')">فيديو</button><button class="btn ${s.permissions?.game?'success':'danger'}" onclick="perm('${s.id}','game')">لعبة</button></div></td><td><div class="row"><button class="btn secondary" onclick="studentModal('${s.id}')">تعديل</button><button class="btn warn" onclick="showCredentials('${s.id}')">بيانات الدخول</button><button class="btn secondary" onclick="studentMonitor('${s.id}')">متابعة</button><button class="btn danger" onclick="deleteStudent('${s.id}')">حذف</button></div></td></tr>`).join(''):`<tr><td colspan="7"><div class="empty">لا يوجد طلاب.</div></td></tr>`}</table></div>`}

function modal(html){const bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML=`<div class="modal">${html}</div>`;bg.addEventListener('click',e=>{if(e.target===bg)bg.remove()});document.body.appendChild(bg);return bg}
function ensureToastWrap(){let w=document.querySelector('.toast-wrap');if(!w){w=document.createElement('div');w.className='toast-wrap';document.body.appendChild(w)}return w}
function requestWithProgress(method,url,body,label,contentType){return new Promise((resolve,reject)=>{const wrap=ensureToastWrap();const card=document.createElement('div');card.className='card toast-card';card.innerHTML=`<div class="row" style="justify-content:space-between"><b>${esc(label)}</b><span class="muted pct">0%</span></div><div class="progress" style="margin-top:8px"><span style="width:0%"></span></div>`;wrap.appendChild(card);const bar=card.querySelector('.progress>span'),pctEl=card.querySelector('.pct');const xhr=new XMLHttpRequest();xhr.open(method,url);if(token)xhr.setRequestHeader('Authorization','Bearer '+token);if(contentType)xhr.setRequestHeader('Content-Type',contentType);xhr.upload.onprogress=e=>{if(e.lengthComputable){const p=Math.round(e.loaded/e.total*100);bar.style.width=p+'%';pctEl.textContent=p+'%'}};xhr.onload=()=>{card.remove();let j={};try{j=JSON.parse(xhr.responseText)}catch{}if(xhr.status>=200&&xhr.status<300)resolve(j);else reject(Error(j.error||'فشل الحفظ'))};xhr.onerror=()=>{card.remove();reject(Error('فشل الاتصال بالخادم أثناء الحفظ'))};xhr.send(body)})}
function uploadWithProgress(url,fd,label){return requestWithProgress('POST',url,fd,label)}

function classModal(id){const c=id?data.classes.find(x=>x.id===id):{name:'',subjects:[]};const bg=modal(`<div class="modal-head"><h2>${id?'تعديل الصف':'صف جديد'}</h2><button class="close" onclick="this.closest('.modal-bg').remove()">×</button></div><div class="field"><label>اسم الصف</label><input id="mName" value="${esc(c.name)}"></div><div class="field"><label>مواد هذا الصف</label><div id="subjectsBox">${(c.subjects||[]).map(x=>`<div class="row" style="margin-bottom:6px"><input class="subject-input" value="${esc(x.name)}" placeholder="اسم المادة"><button type="button" class="btn danger" onclick="this.parentElement.remove()">حذف</button></div>`).join('')}</div><button type="button" class="btn secondary" onclick="addSubjectField()">＋ إضافة مادة</button></div><div class="notice">إضافة مادة لا تنشئ صفاً جديداً؛ كل المواد تظل داخل نفس الصف.</div><div class="row"><button class="btn primary" id="save">حفظ</button><button class="btn secondary" onclick="this.closest('.modal-bg').remove()">إلغاء</button></div>`);bg.querySelector('#save').onclick=async()=>{try{const subjects=[...bg.querySelectorAll('.subject-input')].map(x=>x.value.trim()).filter(Boolean);await api(id?'/api/classes/'+id:'/api/classes',{method:id?'PUT':'POST',body:JSON.stringify({name:$('mName').value,subjects})});bg.remove();teacherApp()}catch(e){alert(e.message)}}}

function studentModal(id){const s=id?data.students.find(x=>x.id===id):{name:'',username:'',classId:data.classes[0]?.id||'',phone:'',parentName:'',parentPhone:'',parentId:''};const currentParent=data.parents?.find(p=>p.id===s.parentId);const bg=modal(`<div class="modal-head"><h2>${id?'تعديل الطالب':'طالب جديد'}</h2><button class="close" onclick="this.closest('.modal-bg').remove()">×</button></div><div class="field"><label>اسم الطالب</label><input id="mName" value="${esc(s.name)}"></div><div class="field"><label>اسم دخول الطالب</label><input id="mUsername" value="${esc(s.username||'')}"></div><div class="field"><label>كلمة مرور الطالب ${id?'(اختياري لتغييرها)':''}</label><input id="mPassword" type="text"></div><div class="field"><label>الصف</label><select id="mClass">${data.classes.map(c=>`<option value="${c.id}" ${c.id===s.classId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>المواد المتاحة للطالب</label><div id="studentSubjects"></div><div class="row"><button type="button" class="btn success" id="allSubjects">إتاحة جميع المواد</button><button type="button" class="btn danger" id="noSubjects">حجب جميع المواد</button></div><div class="muted">اختر مادة واحدة أو عدة مواد. الطالب يستخدم نفس اسم المستخدم وكلمة المرور للدخول إلى جميع المواد المسموح بها.</div></div><div class="field"><label>هاتف الطالب</label><input id="mPhone" dir="ltr" value="${esc(s.phone||'')}"></div><div class="field"><label>حساب ولي الأمر</label><select id="mParentMode"><option value="existing">ربطه بولي أمر مسجل من قبل</option><option value="new">إنشاء حساب ولي أمر جديد</option></select></div><div id="existingParentBox"><div class="field"><label>اختر ولي الأمر المسجل</label><select id="mParentId"><option value="">— اختر ولي الأمر —</option>${(data.parents||[]).map(p=>`<option value="${p.id}" ${p.id===s.parentId?'selected':''}>${esc(p.name)} — ${esc(p.phone||'بدون رقم')} — ${p.childrenCount||data.students.filter(x=>x.parentId===p.id).length} أبناء</option>`).join('')}</select></div><div class="notice">سيتمكن ولي الأمر المحدد من رؤية هذا الطالب مع جميع أبنائه من <b>حساب واحد</b>.</div></div><div id="newParentBox" class="hidden"><div class="field"><label>اسم ولي الأمر</label><input id="mParentName" value="${esc(s.parentName||'')}"></div><div class="field"><label>رقم ولي الأمر</label><input id="mParentPhone" dir="ltr" value="${esc(s.parentPhone||'')}"></div><div class="field"><label>كلمة مرور ولي الأمر ${id?'(لحساب جديد فقط)':''}</label><input id="mParentPassword" type="text"></div><div class="notice">سيتم إنشاء <b>حساب واحد</b> لولي الأمر، ويمكن ربط أبناء آخرين به لاحقًا.</div></div><div class="row"><button class="btn primary" id="save">حفظ</button><button class="btn secondary" onclick="this.closest('.modal-bg').remove()">إلغاء</button></div>`);const mode=bg.querySelector('#mParentMode'),existing=bg.querySelector('#existingParentBox'),fresh=bg.querySelector('#newParentBox');const sync=()=>{const isNew=mode.value==='new';existing.classList.toggle('hidden',isNew);fresh.classList.toggle('hidden',!isNew)};mode.onchange=sync;sync();const renderStudentSubjects=()=>{const c=data.classes.find(x=>x.id===$('mClass').value),selected=new Set((id?s.subjectIds:(c?.subjects||[]).map(x=>x.id)).map(String));$('studentSubjects').innerHTML=(c?.subjects||[]).map(x=>`<label style="display:block;padding:7px;border-bottom:1px solid var(--border)"><input type="checkbox" value="${x.id}" ${selected.has(String(x.id))?'checked':''}> ${esc(x.name)}</label>`).join('')||'<div class="empty">لا توجد مواد لهذا الصف.</div>'};$('mClass').onchange=renderStudentSubjects;bg.querySelector('#allSubjects').onclick=()=>bg.querySelectorAll('#studentSubjects input').forEach(x=>x.checked=true);bg.querySelector('#noSubjects').onclick=()=>bg.querySelectorAll('#studentSubjects input').forEach(x=>x.checked=false);renderStudentSubjects();bg.querySelector('#save').onclick=async()=>{try{const isNew=mode.value==='new';const subjectIds=[...bg.querySelectorAll('#studentSubjects input:checked')].map(x=>x.value),b={name:$('mName').value,username:$('mUsername').value,password:$('mPassword').value,classId:$('mClass').value,subjectIds,phone:$('mPhone').value,parentMode:isNew?'new':'existing'};if(isNew){b.parentName=$('mParentName').value;b.parentPhone=$('mParentPhone').value;b.parentPassword=$('mParentPassword').value}else{b.parentId=$('mParentId').value}const r=await api(id?'/api/students/'+id:'/api/students',{method:id?'PUT':'POST',body:JSON.stringify(b)});bg.remove();await teacherApp();if(!id&&r.credentials)showCreds(r.credentials)}catch(e){alert(e.message)}}}

async function openAudio(v,student){const bg=modal(`<div class="modal-head"><b>${esc(v.title)}</b><button class="close">×</button></div><div class="audio-box no-select secure-media"><audio id="ap" preload="metadata"></audio><div class="secure-controls"><button id="apPlay" type="button" title="تشغيل/إيقاف">▶</button><input id="apSeek" class="secure-progress" type="range" min="0" max="100" value="0" step="0.1"><span id="apTime" class="secure-time">0:00 / 0:00</span><button id="apMute" type="button" title="كتم الصوت">🔊</button><input id="apVol" class="secure-volume" type="range" min="0" max="1" value="1" step="0.05"></div></div>`);const audio=bg.querySelector('#ap');audio.src=contentMediaUrl('audio',v,student?.id||'');const play=bg.querySelector('#apPlay'),seek=bg.querySelector('#apSeek'),time=bg.querySelector('#apTime'),mute=bg.querySelector('#apMute'),vol=bg.querySelector('#apVol');const fmt=t=>{t=Number(t)||0;const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0')};const update=()=>{const d=audio.duration||0;seek.value=d?audio.currentTime/d*100:0;time.textContent=fmt(audio.currentTime)+' / '+fmt(d);play.textContent=audio.paused?'▶':'⏸';mute.textContent=audio.muted?'🔇':'🔊'};play.onclick=()=>audio.paused?audio.play():audio.pause();seek.oninput=()=>{if(audio.duration)audio.currentTime=audio.duration*(Number(seek.value)/100)};mute.onclick=()=>audio.muted=!audio.muted;vol.oninput=()=>{audio.volume=Number(vol.value);audio.muted=audio.volume===0};['loadedmetadata','timeupdate','play','pause','ended','volumechange'].forEach(e=>audio.addEventListener(e,update));let watched=0,last=0,saveLock=false,previous;try{const j=await api(user.role==='student'?'/api/student/me':'/api/teacher/dashboard');previous=(j.audioProgress||[]).find(x=>x.studentId===(student?.id||'')&&x.audioId===v.id)}catch{}if(previous)audio.addEventListener('loadedmetadata',()=>{audio.currentTime=Math.min(previous.lastPositionSeconds||0,audio.duration||0)});async function persist(ev){if(!student||saveLock)return;saveLock=true;try{await api('/api/audio-progress',{method:'POST',body:JSON.stringify({audioId:v.id,event:ev,durationSeconds:audio.duration||v.durationSeconds||0,watchedSeconds:Math.round(watched),positionSeconds:Math.round(audio.currentTime)})})}catch{}finally{saveLock=false}}audio.onplay=()=>{last=audio.currentTime;persist('play')};audio.onpause=()=>persist('pause');audio.ontimeupdate=()=>{update();if(audio.paused)return;const d=audio.currentTime-last;if(d>=0&&d<=1.5)watched+=d;last=audio.currentTime;if(Math.floor(watched)%10===0)persist('progress')};audio.onended=()=>{watched=Math.max(watched,audio.duration||0);persist('ended')};bg.querySelector('.close').onclick=async()=>{await persist('pause');bg.remove()};bg.oncontextmenu=e=>e.preventDefault();if(student)await persist('open')}

function renderQEditor(bg){
 const box=bg?.querySelector('#questions');if(!box)return;
 const richPreview=(img,label)=>img?`<div class="row"><span class="badge green">${label}</span><button class="btn secondary" type="button" onclick="${img==='q'?'removeQuestionImage':img==='n'?'removeNoteImage':'removeOptionImage'}">إزالة الصورة</button></div>`:'';

function showParent(kind){const j=window.parentData.j,el=$('parentDetail');if(kind==='documents'){el.innerHTML=`<div class="card"><h2>📚 الكتب والمذكرات</h2>${(j.documents||[]).length?`<div class="grid">${j.documents.map(d=>`<button class="click-card" onclick='openDocument(${JSON.stringify(d)})'><div class="stat"><div style="font-size:30px">${d.mimeType==='application/pdf'?'📕':'🖼️'}</div><div><b>${esc(d.title)}</b><div class="muted">${esc(d.description||'ملف تعليمي')}</div></div><span>▶</span></div></button>`).join('')}</div>`:'<div class="empty">لا توجد كتب أو مذكرات متاحة.</div>'}</div>`}else if(kind==='audios'){const by=Object.fromEntries((j.audioProgress||[]).map(p=>[p.audioId,p])),started=j.audios.filter(v=>(by[v.id]?.watchedSeconds||0)>0);el.innerHTML=`<div class="card"><h2>الصوتيات التي بدأها الطالب</h2>${started.length?`<table class="table"><tr><th>الصوت</th><th>مدة الصوت</th><th>استماع الطالب</th><th>النسبة</th><th>الحالة</th></tr>${started.map(v=>{const p=by[v.id],pr=pct(p.watchedSeconds,p.durationSeconds||v.durationSeconds);return `<tr><td>${esc(v.title)}</td><td>${fmtSec(p.durationSeconds||v.durationSeconds)}</td><td>${fmtSec(p.watchedSeconds)}</td><td>${pr}%</td><td>${p.completed?'مكتمل':'قيد المتابعة'}</td></tr>`}).join('')}</table>`:'<div class="empty">لم يبدأ الطالب أي صوت.</div>'}`}else if(kind==='games'){el.innerHTML=`<div class="card"><h2>الألعاب التي دخل عليها الطالب</h2>${j.games.length?`<table class="table"><tr><th>اللعبة</th><th>الحالة</th></tr>${j.games.map(g=>`<tr><td>${esc(g.title)}</td><td><span class="badge green">دخل اللعبة</span></td></tr>`).join('')}</table>`:'<div class="empty">لم يدخل الطالب أي لعبة حتى الآن.</div>'}`}else if(kind==='tests'){const latest={};(j.results||[]).forEach(r=>{if(!latest[r.testId])latest[r.testId]=r});el.innerHTML=`<div class="card"><h2>الاختبارات الإلكترونية</h2>${j.tests.length?`<table class="table"><tr><th>الاختبار</th><th>الدرجة</th><th>النسبة</th><th>الأخطاء</th><th>التاريخ</th></tr>${j.tests.map(t=>{const r=latest[t.id];return `<tr><td>${esc(t.title)}</td><td>${r?r.score+'/'+r.total:'—'}</td><td>${r?r.percentage+'%':'—'}</td><td>${r?`<button class="btn secondary" onclick='resultDetails(${JSON.stringify(r)})'>عرض (${r.errors.length})</button>`:'—'}</td><td>${r?new Date(r.createdAt).toLocaleString('ar-EG'):'لم يسجل نتيجة'}</td></tr>`}).join('')}</table>`:'<div class="empty">لم يدخل الطالب أي اختبار.</div>'}`}else{const by=Object.fromEntries((j.videoProgress||[]).map(p=>[p.videoId,p])),started=j.videos.filter(v=>(by[v.id]?.watchedSeconds||0)>0);el.innerHTML=`<div class="card"><h2>الفيديوهات التي بدأها الطالب</h2>${started.length?`<table class="table"><tr><th>الفيديو</th><th>مدة الفيديو</th><th>شاهد الطالب</th><th>النسبة</th><th>الحالة</th></tr>${started.map(v=>{const p=by[v.id],pr=pct(p.watchedSeconds,p.durationSeconds||v.durationSeconds);return `<tr><td>${esc(v.title)}</td><td>${fmtSec(p.durationSeconds||v.durationSeconds)}</td><td>${fmtSec(p.watchedSeconds)}</td><td>${pr}%</td><td>${p.completed?'مكتمل':'قيد المتابعة'}</td></tr>`}).join('')}</table>`:'<div class="empty">لم يبدأ الطالب أي فيديو.</div>'}`}}
async function saveSettings(){await api('/api/settings',{method:'PATCH',body:JSON.stringify({schoolName:$('schoolName').value})});teacherApp()}async function changeAdminPassword(){try{await api('/api/admin/password',{method:'POST',body:JSON.stringify({currentPassword:$('currentAdminPassword').value,password:$('newAdminPassword').value})});alert('تم تغيير كلمة المرور.');$('currentAdminPassword').value='';$('newAdminPassword').value=''}catch(e){alert(e.message)}}async function notify(id){try{const r=await api('/api/results/'+id+'/notify',{method:'POST'});if(r.whatsapp?.url)window.open(r.whatsapp.url,'_blank');alert(r.whatsapp?.message||'تم الإرسال')}catch(e){alert(e.message)}}async function exportData(){const j=await api('/api/export');const blob=new Blob([JSON.stringify(j,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='edu-platform-backup.json';a.click()}
boot();
</script></body></html>

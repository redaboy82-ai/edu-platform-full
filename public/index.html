<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>منصّة الدروس</title>
<style>
:root{--bg:#f5f5f1;--surface:#fff;--border:#e3e1d9;--navy:#1e3a5f;--navy2:#152b47;--soft:#eaf0f6;--amber:#c98a3e;--green:#2f8f5b;--greenSoft:#e7f4ed;--red:#c4453b;--redSoft:#fbeae9;--text:#23282e;--muted:#6b7280;--shadow:0 10px 30px #1e3a5f12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh;display:flex}.side{width:250px;background:var(--navy);color:#fff;padding:22px 14px;flex-shrink:0}.brand{padding:4px 10px 22px}.brand b{display:block;font-size:20px}.brand small{color:#c5d2df;font-size:12px;display:block;margin-top:6px}.nav button{display:flex;width:100%;border:0;background:transparent;color:#d6dfeb;padding:12px;border-radius:10px;gap:10px;align-items:center;text-align:right;margin:3px 0}.nav button.active,.nav button:hover{background:#ffffff1d;color:#fff}.nav .i{width:24px;text-align:center}.main{flex:1;padding:28px;min-width:0}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px}.title h1{margin:0;font-size:26px}.title p{margin:6px 0 0;color:var(--muted)}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700}.primary{background:var(--navy);color:#fff}.secondary{background:#fff;border:1px solid var(--border)}.danger{background:var(--red);color:#fff}.success{background:var(--green);color:#fff}.warn{background:#f6ead7;color:#7a4e17}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.click-card{width:100%;border:1px solid var(--border);background:#fff;border-radius:12px;padding:18px;text-align:right;box-shadow:var(--shadow)}.click-card:hover{transform:translateY(-2px)}.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:var(--shadow)}.stat{display:flex;align-items:center;gap:12px}.big{font-size:25px;font-weight:800}.muted{font-size:13px;color:var(--muted)}.hero{background:linear-gradient(135deg,var(--navy),#2d557d);color:#fff;border-radius:16px;padding:24px;margin-bottom:18px}.hero h2{margin:0 0 6px}.hero p{margin:0;color:#deebf7;line-height:1.8}.section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center}.road{display:flex;align-items:center;width:100%;border:0;background:#fff;border-top:1px solid var(--border);padding:14px 0;gap:12px;text-align:right}.num{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800}.num.on{background:var(--navy);color:#fff}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.filters input,.filters select,.field input,.field select,.field textarea{background:#fbfbf9;border:1px solid var(--border);border-radius:8px;padding:10px;width:100%;outline:none}.filters input{width:320px}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-weight:700;font-size:13px;margin-bottom:6px}.table-wrap{padding:0;overflow:auto}.table{border-collapse:collapse;width:100%;min-width:700px}.table th,.table td{padding:12px 14px;border-bottom:1px solid var(--border);text-align:right}.table th{font-size:12px;color:var(--muted);background:#fafafa}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800}.badge.green{background:var(--greenSoft);color:var(--green)}.badge.red{background:var(--redSoft);color:var(--red)}.empty{padding:36px;text-align:center;color:var(--muted)}.notice{background:#fff7e8;border:1px solid #edd2a6;color:#7a4e17;line-height:1.8}.modal-bg{position:fixed;inset:0;background:#10151b8c;z-index:50;display:flex;align-items:center;justify-content:center;padding:15px}.modal{background:#fff;border-radius:16px;width:min(700px,100%);max-height:94vh;overflow:auto;padding:20px}.modal.game{width:min(1200px,100%);height:94vh}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.close{border:0;background:transparent;font-size:24px}.game-frame{width:100%;height:calc(100% - 45px);border:1px solid var(--border);border-radius:10px;background:#fff}.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#eef2f6,#f5f5f1)}.login{width:min(920px,100%);display:grid;grid-template-columns:1fr 1fr;gap:18px}.login-info{background:var(--navy);color:#fff;border-radius:16px;padding:28px}.login-info h1{margin-top:0}.login-form{background:#fff;border:1px solid var(--border);border-radius:16px;padding:28px}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1}.tabs .active{background:var(--navy);color:#fff}.credentials{background:var(--greenSoft);border:1px solid #bfe0cd;color:#205f3d;padding:12px;border-radius:10px;margin-top:10px}.link-btn{display:inline-block;padding:7px 10px;background:var(--soft);color:var(--navy);border-radius:8px;text-decoration:none;font-weight:700;font-size:12px}.privacy{color:var(--muted);font-size:12px;line-height:1.8}.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--navy);font-size:12px;font-weight:700}.progress-wrap{min-width:150px}.progress{height:8px;background:#eef1f4;border-radius:99px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--green);border-radius:99px}.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.metric{padding:14px;border:1px solid var(--border);border-radius:10px;background:#fbfbf9}.metric b{display:block;font-size:20px}.activity{padding:11px 0;border-bottom:1px solid var(--border)}.activity:last-child{border-bottom:0}.video-box{background:#000;border-radius:12px;overflow:hidden}.video-box video{width:100%;max-height:70vh;display:block}.custom-video-controls{display:flex;align-items:center;gap:10px;padding:10px;background:#111;color:#fff}.video-control-btn{width:38px;height:34px;border:1px solid #ffffff33;border-radius:8px;background:#222;color:#fff;font-weight:800}.video-seek{flex:1;accent-color:#2f8f5b;height:28px}.video-time{min-width:120px;text-align:center;font-size:12px;direction:ltr}.toast-wrap{position:fixed;bottom:16px;left:16px;z-index:80;display:flex;flex-direction:column;gap:10px;width:320px;max-width:92vw}.toast-card{padding:14px}.no-select{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}@media(max-width:900px){.side{width:200px}.main{padding:18px}.login{grid-template-columns:1fr}.filters input{width:100%}}@media(max-width:650px){.app{display:block}.side{width:100%;padding:10px}.brand{display:none}.nav{display:flex;overflow:auto}.nav button{min-width:max-content;width:auto}.main{padding:14px}.top{flex-direction:column}.grid{grid-template-columns:1fr}.table{min-width:620px}}
</style>
</head>
<body><div id="app"></div>
<script>
const API='';let token=localStorage.getItem('edu_token')||'';let user=null;let data=null;let loginRole='teacher';let selectedStudent=null;let activeGame=null;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function normalizeTestUrl(raw){let u=String(raw||'').trim();if(!u)return '';try{const x=new URL(u);if(!/^https?:$/.test(x.protocol))return '';const m=x.pathname.match(/\/file\/d\/([^/]+)/);if(x.hostname==='drive.google.com'&&m)return 'https://drive.google.com/file/d/'+m[1]+'/preview';const id=x.searchParams.get('id');if(x.hostname==='drive.google.com'&&id)return 'https://drive.google.com/file/d/'+encodeURIComponent(id)+'/preview';return u}catch{return ''}}
async function api(path,opts={}){opts.headers={...(opts.headers||{}),'Content-Type':'application/json'};if(token)opts.headers.Authorization='Bearer '+token;const r=await fetch(API+path,opts);const j=await r.json().catch(()=>({}));if(r.status===401){logout();throw new Error(j.error||'انتهت الجلسة')}if(!r.ok)throw new Error(j.error||'حدث خطأ');return j}
function setToken(t,u){token=t;user=u;localStorage.setItem('edu_token',t)}
async function boot(){if(token){try{const m=await api('/api/me');user=m.user;await renderRole()}catch{renderLogin()}}else renderLogin()}
function renderLogin(){document.title='تسجيل الدخول | منصّة الدروس';$('app').innerHTML=`<div class="login-wrap"><div class="login"><div class="login-info"><h1>منصّة الدروس</h1><p>منصة تعليمية لإدارة الطلاب والصفوف والفيديوهات والألعاب التعليمية والنتائج.</p><ul><li>دخول مستقل للمعلم والطالب وولي الأمر</li><li>تشغيل الألعاب التعليمية داخل المنصة</li><li>متابعة المشاهدة والنتائج</li><li>إشعارات لولي الأمر</li></ul></div><div class="login-form"><div class="tabs"><button class="btn ${loginRole==='teacher'?'active':''} ${loginRole==='teacher'?'primary':'secondary'}" onclick="loginRole='teacher';renderLogin()">المعلم</button><button class="btn ${loginRole==='student'?'active':''} ${loginRole==='student'?'primary':'secondary'}" onclick="loginRole='student';renderLogin()">الطالب</button><button class="btn ${loginRole==='parent'?'active':''} ${loginRole==='parent'?'primary':'secondary'}" onclick="loginRole='parent';renderLogin()">ولي الأمر</button></div><div class="field"><label>${loginRole==='teacher'?'اسم المستخدم':loginRole==='student'?'اسم دخول الطالب':'كود ولي الأمر'}</label><input id="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password"></div><button class="btn primary" style="width:100%" onclick="doLogin()">دخول</button>${loginRole==='teacher'?'<p class="privacy" style="text-align:center"><a href="#" onclick="forgotPasswordModal();return false">نسيت اسم المستخدم أو كلمة المرور؟</a></p>':''}<p id="loginErr" class="privacy" style="color:var(--red)"></p></div></div></div>`}
function forgotPasswordModal(){const bg=modal(`<div class="modal-head"><h2>استعادة دخول المعلم</h2><button class="close" onclick="this.closest('.modal-bg').remove()">×</button></div><p class="privacy">سيتم إرسال رمز تحقق عبر واتساب إلى رقم الاستعادة المسجّل لهذا الحساب.</p><button class="btn secondary" id="sendCode" style="width:100%">إرسال رمز التحقق</button><p id="forgotStep1Msg" class="privacy"></p><div id="forgotStep2" style="display:none;margin-top:14px"><div class="field"><label>رمز التحقق</label><input id="resetCode"></div><div class="field"><label>اسم المستخدم الجديد (اختياري، اتركه فارغًا للإبقاء عليه)</label><input id="resetUsername"></div><div class="field"><label>كلمة المرور الجديدة</label><input id="resetPassword" type="password" placeholder="6 أحرف على الأقل"></div><button class="btn primary" style="width:100%" onclick="doResetPassword()">تأكيد وتعيين بيانات جديدة</button></div><p id="forgotErr" class="privacy" style="color:var(--red)"></p>`);
  bg.querySelector('#sendCode').onclick=async()=>{const btn=bg.querySelector('#sendCode');btn.disabled=true;try{const j=await api('/api/admin/forgot',{method:'POST',body:JSON.stringify({})});$('forgotStep1Msg').textContent=j.message||'';if(j.mode==='automatic')$('forgotStep2').style.display='block'}catch(e){$('forgotErr').textContent=e.message}finally{btn.disabled=false}}}
async function doResetPassword(){try{const code=$('resetCode').value.trim();const username=$('resetUsername').value.trim();const password=$('resetPassword').value;if(!code)return $('forgotErr').textContent='اكتب رمز التحقق';if(!password||password.length<6)return $('forgotErr').textContent='كلمة المرور يجب أن تكون 6 أحرف على الأقل';await api('/api/admin/reset',{method:'POST',body:JSON.stringify({code,username,password})});document.querySelector('.modal-bg').remove();loginRole='teacher';renderLogin();$('loginErr').style.color='var(--green,#1a7f37)';$('loginErr').textContent='تم تعيين بيانات الدخول الجديدة. سجّل الدخول بها الآن.'}catch(e){$('forgotErr').textContent=e.message}}
async function doLogin(){try{const j=await api('/api/login',{method:'POST',body:JSON.stringify({role:loginRole,username:$('username').value,password:$('password').value})});setToken(j.token,j.user);await renderRole()}catch(e){$('loginErr').textContent=e.message}}
function logout(){token='';user=null;localStorage.removeItem('edu_token');document.body.oncontextmenu=null;document.body.oncopy=null;renderLogin()}
async function renderRole(){if(user.role==='teacher')return teacherApp();if(user.role==='student')return studentApp();return parentApp()}
async function teacherApp(){document.body.oncontextmenu=null;document.body.oncopy=null;const j=await api('/api/teacher/dashboard');data=j;renderTeacher('dashboard')}
function shell(active,body){return `<div class="app"><aside class="side"><div class="brand"><b>${esc(data?.settings?.schoolName||'منصّة الدروس')}</b><small>لوحة المعلم والإدارة</small></div><div class="nav">${[['dashboard','⌂','لوحة التحكم'],['classes','🎓','الصفوف'],['students','👥','الطلاب'],['videos','▶','الفيديوهات'],['games','🎮','الألعاب التعليمية'],['tests','📝','الاختبارات الإلكترونية'],['grades','🏆','الدرجات'],['reports','▤','التقارير'],['settings','⚙','الإعدادات']].map(n=>`<button class="${active===n[0]?'active':''}" onclick="renderTeacher('${n[0]}')"><span class="i">${n[1]}</span><span>${n[2]}</span></button>`).join('')}<button onclick="logout()"><span class="i">↩</span><span>خروج</span></button></div></aside><main class="main">${body}</main></div>`}
function teacherHeader(t,p,act=''){return `<div class="top"><div class="title"><h1>${t}</h1><p>${p}</p></div><div class="top-actions">${act}</div></div>`}
function renderTeacher(page){document.title=page==='dashboard'?'لوحة التحكم':'منصّة الدروس';if(page==='dashboard')$('app').innerHTML=shell(page,dashboardView());if(page==='classes')$('app').innerHTML=shell(page,classesView());if(page==='students')$('app').innerHTML=shell(page,studentsView());if(page==='videos')$('app').innerHTML=shell(page,videosView());if(page==='games')$('app').innerHTML=shell(page,gamesView());if(page==='tests')$('app').innerHTML=shell(page,testsView());if(page==='grades')$('app').innerHTML=shell(page,gradesView());if(page==='reports')$('app').innerHTML=shell(page,reportsView());if(page==='settings')$('app').innerHTML=shell(page,settingsView())}
function statCard(label,val,icon,page){return `<button class="click-card" onclick="renderTeacher('${page}')"><div class="stat"><div style="font-size:28px">${icon}</div><div><div class="big">${esc(val)}</div><div class="muted">${esc(label)}</div></div><span style="margin-right:auto">‹</span></div></button>`}
function portalStat(label,val,icon){return `<div class="click-card" style="cursor:default"><div class="stat"><div style="font-size:28px">${icon}</div><div><div class="big">${esc(val)}</div><div class="muted">${esc(label)}</div></div></div></div>`}
function dashboardView(){const avg=data.results.length?Math.round(data.results.reduce((a,b)=>a+b.percentage,0)/data.results.length):0;return teacherHeader('لوحة التحكم','إدارة كاملة للطلاب والألعاب والنتائج')+`<div class="hero"><h2>المنصة جاهزة للعمل</h2><p>أنشئ الصفوف، أضف الطلاب، ارفع ألعاب HTML، ثم اجعل الطالب يدخل بحسابه. عند انتهاء اللعبة تُحفظ النتيجة باسم الطالب ويمكن إرسالها لولي الأمر.</p></div><div class="grid">${statCard('الصفوف',data.classes.length,'🎓','classes')}${statCard('الطلاب',data.students.length,'👥','students')}${statCard('الألعاب',data.games.length,'🎮','games')}${statCard('الاختبارات الإلكترونية',(data.electronicTests||[]).length,'📝','tests')}${statCard('متوسط النتائج',avg+'%','🏆','grades')}</div><div class="section card"><div class="section-head"><h2>بدء الاستخدام</h2><span class="badge green">جاهز</span></div>${[['classes','1','أنشئ الصف الدراسي'],['students','2','أضف الطالب ورقم ولي الأمر'],['games','3','ارفع لعبة HTML'],['grades','4','تابع النتائج والإشعارات']].map(x=>`<button class="road" onclick="renderTeacher('${x[0]}')"><span class="num">${x[1]}</span><span><b>${x[2]}</b><br><span class="muted">اضغط للانتقال</span></span><span style="margin-right:auto">‹</span></button>`).join('')}</div>`}
function classesView(){return teacherHeader('الصفوف','إنشاء الصفوف والمواد',`<button class="btn primary" onclick="classModal()">＋ صف جديد</button>`)+`<div class="card table-wrap"><table class="table"><tr><th>الصف</th><th>المادة</th><th>الطلاب</th><th>إجراءات</th></tr>${data.classes.length?data.classes.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.subject||'—')}</td><td>${data.students.filter(s=>s.classId===c.id).length}</td><td><div class="row"><button class="btn secondary" onclick="classModal('${c.id}')">تعديل</button><button class="btn danger" onclick="deleteClass('${c.id}')">حذف</button></div></td></tr>`).join(''):`<tr><td colspan="4"><div class="empty">لا توجد صفوف بعد.</div></td></tr>`}</table></div>`}
function studentLevel(sid){const rs=data.results.filter(r=>r.studentId===sid);const gameRs=rs.filter(r=>r.resultType!=='test');const testRs=rs.filter(r=>r.resultType==='test');const avg=arr=>arr.length?Math.round(arr.reduce((a,b)=>a+b.percentage,0)/arr.length):null;return {games:avg(gameRs),tests:avg(testRs),overall:avg(rs)}}
function levelBadge(v){return v===null?'<span class="muted">لا توجد نتائج بعد</span>':`<span class="badge ${v>=50?'green':'red'}">${v}%</span>`}
function studentsView(){return teacherHeader('الطلاب','إدارة حسابات الطلاب وبيانات أولياء الأمور',`<button class="btn primary" onclick="studentModal()" ${data.classes.length?'':'disabled'}>＋ طالب جديد</button>`)+`<div class="card table-wrap"><table class="table"><tr><th>الطالب</th><th>الحساب</th><th>الصف</th><th>ولي الأمر</th><th>الألعاب</th><th>الاختبارات</th><th>الصلاحيات</th><th>إجراءات</th></tr>${data.students.length?data.students.map(s=>{const lv=studentLevel(s.id);return `<tr><td><b>${esc(s.name)}</b></td><td dir="ltr">${esc(s.username)}</td><td>${esc(data.classes.find(c=>c.id===s.classId)?.name||'—')}</td><td dir="ltr">${esc(s.parentPhone||'—')}<br><span class="muted">${esc(s.parentCode||'')}</span></td><td>${levelBadge(lv.games)}</td><td>${levelBadge(lv.tests)}</td><td><div class="row"><button class="btn ${s.permissions?.video?'success':'danger'}" onclick="perm('${s.id}','video')">فيديو</button><button class="btn ${s.permissions?.game?'success':'danger'}" onclick="perm('${s.id}','game')">لعبة</button></div></td><td><div class="row"><button class="btn secondary" onclick="studentModal('${s.id}')">تعديل</button><button class="btn warn" onclick="showCredentials('${s.id}')">بيانات الدخول</button><button class="btn secondary" onclick="studentMonitor('${s.id}')">متابعة</button><button class="btn danger" onclick="deleteStudent('${s.id}')">حذف</button></div></td></tr>`}).join(''):`<tr><td colspan="8"><div class="empty">لا يوجد طلاب.</div></td></tr>`}</table></div>`}
function fmtSec(n){n=Math.max(0,Math.round(Number(n||0)));const h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return h?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function pct(w,d){return d>0?Math.min(100,Math.round(w/d*100)):0}
function videosView(){return teacherHeader('الفيديوهات','رفع مباشر للفيديو أو إضافة رابط فيديو',`<button class="btn primary" onclick="videoModal()">＋ فيديو جديد</button>`)+`<div class="card table-wrap"><table class="table"><tr><th>الفيديو</th><th>الصف</th><th>المصدر</th><th>المدة</th><th>إجراءات</th></tr>${(data.videos||[]).length?(data.videos||[]).map(v=>`<tr><td><b>${esc(v.title)}</b><br><span class="muted">${esc(v.description||'')}</span></td><td>${esc(data.classes.find(c=>c.id===v.classId)?.name||'—')}</td><td><span class="pill">${v.sourceType==='upload'?'مرفوع على المنصة':'رابط'}</span></td><td>${fmtSec(v.durationSeconds)}</td><td><div class="row"><button class="btn primary" onclick="previewVideo('${v.id}')">تشغيل</button><button class="btn secondary" onclick="videoModal('${v.id}')">تعديل</button><button class="btn danger" onclick="deleteVideo('${v.id}')">حذف</button></div></td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">لا توجد فيديوهات بعد.</div></td></tr>`}</table></div>`}
function gamesView(){return teacherHeader('الألعاب التعليمية','رفع لعبة HTML وتشغيلها داخل المنصة',`<button class="btn primary" onclick="gameModal()">＋ رفع لعبة HTML</button>`)+`<div class="card table-wrap"><table class="table"><tr><th>اللعبة</th><th>الصف</th><th>الحالة</th><th>إجراءات</th></tr>${data.games.length?data.games.map(g=>`<tr><td><b>${esc(g.title)}</b><br><span class="muted">${esc(g.description||'')}</span></td><td>${esc(data.classes.find(c=>c.id===g.classId)?.name||'—')}</td><td><span class="badge green">تعمل</span></td><td><div class="row"><button class="btn primary" onclick="previewGame('${g.id}')">تشغيل</button><button class="btn secondary" onclick="gameModal('${g.id}')">تعديل</button><button class="btn danger" onclick="deleteGame('${g.id}')">حذف</button></div></td></tr>`).join(''):`<tr><td colspan="4"><div class="empty">لم ترفع ألعاب بعد.</div></td></tr>`}</table></div><div class="notice card" style="margin-top:14px"><b>شرط اللعبة:</b> عند انتهاء اللعبة يجب أن ترسل للمنصة: <code>window.parent.postMessage({type:'EDU_GAME_RESULT', score:8, total:10}, '*')</code></div>`}
function testsView(){return teacherHeader('الاختبارات الإلكترونية','ضع رابط اختبار إلكتروني جاهز من Google Drive أو رابط اختبار ويب ليظهر لطلاب الصف داخل المنصة',`<button class="btn primary" onclick="testModal()">＋ اختبار إلكتروني</button>`)+`<div class="notice card"><b>Google Drive:</b> الصق رابط مشاركة الملف، وستحوّله المنصة تلقائياً إلى رابط المعاينة داخل المنصة. <b>Google Forms:</b> الصق رابط النموذج مباشرة إذا كان يسمح بالتضمين.</div><div class="card table-wrap"><table class="table"><tr><th>الاختبار</th><th>الصف</th><th>المصدر</th><th>إجراءات</th></tr>${(data.electronicTests||[]).length?data.electronicTests.map(t=>`<tr><td><b>${esc(t.title)}</b><br><span class="muted">${esc(t.description||'')}</span></td><td>${esc(data.classes.find(c=>c.id===t.classId)?.name||'—')}</td><td><span class="link-btn">${/drive\.google\.com/i.test(t.url)?'Google Drive':'رابط ويب'}</span></td><td><div class="row"><button class="btn primary" onclick="previewTest('${t.id}')">تشغيل</button><button class="btn secondary" onclick="testModal('${t.id}')">تعديل</button><button class="btn danger" onclick="deleteTest('${t.id}')">حذف</button></div></td></tr>`).join(''):`<tr><td colspan="4"><div class="empty">لا توجد اختبارات إلكترونية بعد.</div></td></tr>`}</table></div>`}
function gradesView(){return teacherHeader('الدرجات','نتائج الألعاب والاختبارات الإلكترونية',`<button class="btn primary" onclick="manualGradeModal()">＋ تسجيل درجة يدويًا</button><button class="btn secondary" onclick="exportData()">⬇ تصدير</button>`)+`<div class="card table-wrap"><table class="table"><tr><th>الطالب</th><th>النوع</th><th>النشاط</th><th>الدرجة</th><th>النسبة</th><th>التاريخ</th><th>الإشعار</th></tr>${data.results.length?data.results.map(r=>`<tr><td><b>${esc(r.studentName)}</b></td><td><span class="pill">${r.resultType==='test'?'اختبار إلكتروني':'لعبة'}</span></td><td>${esc(r.title||r.gameTitle||r.testTitle||'—')}</td><td>${r.score}/${r.total}</td><td><span class="badge ${r.percentage>=50?'green':'red'}">${r.percentage}%</span></td><td>${new Date(r.createdAt).toLocaleString('ar-EG')}</td><td><button class="btn success" onclick="notify('${r.id}')">${r.notified?'أُرسل':'إرسال واتساب'}</button></td></tr>`).join(''):`<tr><td colspan="7"><div class="empty">لا توجد نتائج بعد.</div></td></tr>`}</table></div>`}
function reportsView(){const avg=data.results.length?Math.round(data.results.reduce((a,b)=>a+b.percentage,0)/data.results.length):0;return teacherHeader('التقارير','مؤشرات مختصرة قابلة للتصدير')+`<div class="grid">${statCard('عدد المحاولات',data.results.length,'🧮','grades')}${statCard('متوسط النسبة',avg+'%','📈','grades')}${statCard('الطلاب',data.students.length,'👥','students')}${statCard('الألعاب',data.games.length,'🎮','games')}</div><div class="section card"><button class="btn primary" onclick="exportData()">⬇ تنزيل نسخة احتياطية JSON</button><input id="importFile" class="hidden" type="file" accept="application/json" onchange="importData(this)"><button class="btn secondary" onclick="$('importFile').click()">⬆ استيراد نسخة</button></div>`}
function settingsView(){return teacherHeader('الإعدادات','إعدادات المنصة والنسخ الاحتياطية')+`<div class="card"><div class="field"><label>اسم المنصة</label><input id="schoolName" value="${esc(data.settings.schoolName||'منصّة الدروس')}"></div><button class="btn primary" onclick="saveSettings()">حفظ الإعدادات</button><div style="height:1px;background:var(--border);margin:18px 0"></div><h3 style="margin:0 0 10px">بيانات دخول المعلم</h3><div class="field"><label>اسم المستخدم الحالي</label><input value="${esc(data.adminUsername||'')}" disabled></div><div class="field"><label>اسم المستخدم الجديد</label><input id="newAdminUsername" placeholder="3 أحرف على الأقل، بدون مسافات"></div><div class="field"><label>كلمة المرور الحالية (للتأكيد)</label><input id="currentPasswordForUsername" type="password"></div><button class="btn secondary" onclick="changeAdminUsername()">تغيير اسم المستخدم</button><div style="height:1px;background:var(--border);margin:18px 0"></div><div class="field"><label>رقم استعادة الحساب الحالي (واتساب)</label><input value="+${esc(data.adminRecoveryPhone||"")}" disabled></div><div class="field"><label>رقم استعادة جديد</label><input id="newRecoveryPhone" dir="ltr" placeholder="مثال: 201093559477"></div><div class="field"><label>كلمة المرور الحالية (للتأكيد)</label><input id="currentPasswordForPhone" type="password"></div><button class="btn secondary" onclick="changeRecoveryPhone()">تحديث رقم الاستعادة</button><p class="privacy">يُستخدم هذا الرقم لإرسال رمز استعادة الدخول عبر واتساب من رابط «نسيت اسم المستخدم أو كلمة المرور؟» في شاشة الدخول (يتطلب ضبط WhatsApp Cloud API على الخادم).</p><div style="height:1px;background:var(--border);margin:18px 0"></div><div class="field"><label>كلمة المرور الحالية</label><input id="currentAdminPassword" type="password"></div><div class="field"><label>كلمة مرور جديدة</label><input id="newAdminPassword" type="password" placeholder="6 أحرف على الأقل"></div><button class="btn secondary" onclick="changeAdminPassword()">تغيير كلمة المرور</button><p class="privacy">تنبيه: احتفظ باسم المستخدم وكلمة المرور الجديدين في مكان آمن قبل الخروج من الجلسة الحالية؛ لا توجد حاليًا وسيلة لاستعادتهما تلقائيًا من داخل المنصة إذا نسيتهما.</p><p class="privacy">الإرسال الآلي الحقيقي لواتساب يتطلب تشغيل الخادم بمتغيرات WHATSAPP_TOKEN و WHATSAPP_PHONE_NUMBER_ID. بدونها، ستظهر رسالة واتساب جاهزة لفتحها وإرسالها.</p><button class="btn danger" onclick="resetWarning()">شرح إعادة الضبط</button></div>`}
function modal(html){const bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML=`<div class="modal">${html}</div>`;bg.addEventListener('click',e=>{if(e.target===bg)bg.remove()});document.body.appendChild(bg);return bg}
function classModal(id){const c=id?data.classes.find(x=>x.id===id):{name:'',subject:''};const bg=modal(`<div class="modal-head"><h2>${id?'تعديل الصف':'صف جديد'}</h2><button class="close" onclick="this.closest('.modal-bg').remove()">×</button></div><div class="field"><label>اسم الصف</label><input id="mName" value="${esc(c.name)}"></div><div class="field"><label>المادة</label><input id="mSubject" value="${esc(c.subject||'')}"></div><div class="row"><button class="btn primary" id="save">حفظ</button><button class="btn secondary" onclick="this.closest('.modal-bg').remove()">إلغاء</button></div>`);bg.querySelector('#save').onclick=async()=>{try{const b={name:$('mName').value,subject:$('mSubject').value};await api(id?'/api/classes/'+id:'/api/classes',{method:id?'PUT':'POST',body:JSON.stringify(b)});bg.remove();await teacherApp()}catch(e){alert(e.message)}}}
function studentModal(id){const s=id?data.students.find(x=>x.id===id):{name:'',username:'',classId:data.classes[0]?.id||'',phone:'',parentName:'',parentPhone:''};const bg=modal(`<div class="modal-head"><h2>${id?'تعديل الطالب':'طالب جديد'}</h2><button class="close" onclick="this.closest('.modal-bg').remove()">×</button></div><div class="field"><label>اسم الطالب</label><input id="mName" value="${esc(s.name)}"></div><div class="field"><label>اسم دخول الطالب ${id?'':'(يُنشأ تلقائياً عند تركه فارغاً)'}</label><input id="mUsername" value="${esc(s.username||'')}"></div><div class="field"><label>كلمة مرور الطالب ${id?'(اتركها كما هي دون تغيير)':'(اتركها فارغة للتوليد التلقائي)'}</label><input id="mPassword" type="text"></div><div class="field"><label>الصف</label><select id="mClass">${data.classes.map(c=>`<option value="${c.id}" ${c.id===s.classId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>هاتف الطالب</label><input id="mPhone" dir="ltr" value="${esc(s.phone||'')}"></div><div class="field"><label>اسم ولي الأمر</label><input id="mParentName" value="${esc(s.parentName||'')}"></div><div class="field"><label>رقم ولي الأمر</label><input id="mParentPhone" dir="ltr" value="${esc(s.parentPhone||'')}"></div><div class="field"><label>كلمة مرور ولي الأمر ${id?'(اختياري)':'(اتركها فارغة للتوليد)'}</label><input id="mParentPassword" type="text"></div><div class="row"><button class="btn primary" id="save">حفظ</button><button class="btn secondary" onclick="this.closest('.modal-bg').remove()">إلغاء</button></div>`);bg.querySelector('#save').onclick=async()=>{try{const b={name:$('mName').value,username:$('mUsername').value,password:$('mPassword').value,classId:$('mClass').value,phone:$('mPhone').value,parentName:$('mParentName').value,parentPhone:$('mParentPhone').value,parentPassword:$('mParentPassword').value};const r=await api(id?'/api/students/'+id:'/api/students',{method:id?'PUT':'POST',body:JSON.stringify(b)});bg.remove();await teacherApp();if(!id&&r.credentials)showCreds(r.credentials)}catch(e){alert(e.message)}}}
function showCredentials(id){const s=data.students.find(x=>x.id===id);showCreds({username:s.username,password:s.initialPassword,parentCode:s.parentCode,parentPassword:s.initialParentPassword})}
function showCreds(c){modal(`<div class="modal-head"><h2>بيانات الدخول</h2><button class="close" onclick="this.closest('.modal-bg').remove()">×</button></div><div class="credentials"><div><b>الطالب</b><br>اسم الدخول: <code>${esc(c.username)}</code><br>كلمة المرور: <code>${esc(c.password||'غير متاح')}</code></div><hr><div><b>ولي الأمر</b><br>الكود: <code>${esc(c.parentCode)}</code><br>كلمة المرور: <code>${esc(c.parentPassword||'غير متاح')}</code></div></div><p class="privacy">احتفظ بهذه البيانات بأمان ولا تشاركها مع أي شخص غير صاحب الحساب.</p>`)}
async function perm(id,key){try{const s=data.students.find(x=>x.id===id);await api('/api/students/'+id+'/permissions',{method:'PATCH',body:JSON.stringify({[key]:!s.permissions?.[key]})});await teacherApp()}catch(e){alert(e.message)}}

function gameModal(id){const g=id?data.games.find(x=>x.id===id):{title:'',classId:data.classes[0]?.id||'',description:''};const bg=modal(`<div class="modal-head"><h2>${id?'تعديل اللعبة':'رفع لعبة HTML'}</h2><button class="close" onclick="this.closest('.modal-bg').remove()">×</button></div><div class="field"><label>اسم اللعبة</label><input id="mTitle" value="${esc(g.title)}"></div><div class="field"><label>الصف</label><select id="mClass">${data.classes.map(c=>`<option value="${c.id}" ${c.id===g.classId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>وصف</label><textarea id="mDesc">${esc(g.description||'')}</textarea></div><div class="field"><label>ملف اللعبة HTML ${id?'(اختياري لاستبدال اللعبة)':'المطلوب'}</label><input id="mFile" type="file" accept=".html,text/html"></div><div class="notice">حجم الملف الأقصى 12MB. اللعبة ستفتح داخل iframe ولا يظهر للطالب زر تنزيل.</div><div class="row"><button class="btn primary" id="save">حفظ</button><button class="btn secondary" onclick="this.closest('.modal-bg').remove()">إلغاء</button></div>`);bg.querySelector('#save').onclick=async()=>{try{const f=$('mFile').files[0];let html='';if(f)html=await f.text();if(!id&&!html)return alert('اختر ملف HTML للعبة');const payload={title:$('mTitle').value,classId:$('mClass').value,description:$('mDesc').value,html};bg.remove();uploadGameInBackground(payload,id);}catch(e){alert(e.message)}}}
function uploadGameInBackground(payload,id){const wrap=ensureToastWrap();const box=document.createElement('div');box.className='card toast-card';const titleText=payload.title||'اللعبة';box.innerHTML=`<div class="row" style="justify-content:space-between"><b>جاري حفظ لعبة "${esc(titleText)}"</b><span class="muted" data-role="pct">0%</span></div><div class="progress" style="margin-top:8px"><span data-role="bar" style="width:0%"></span></div><div class="muted" style="margin-top:6px">لا تغلق الصفحة حتى ينتهي الحفظ</div>`;wrap.appendChild(box);const xhr=new XMLHttpRequest();xhr.open(id?'PUT':'POST',id?'/api/games/'+id:'/api/games');xhr.setRequestHeader('Content-Type','application/json');xhr.setRequestHeader('Authorization','Bearer '+token);xhr.upload.onprogress=(e)=>{if(e.lengthComputable){const p=Math.round(e.loaded/e.total*100);box.querySelector('[data-role="pct"]').textContent=p+'%';box.querySelector('[data-role="bar"]').style.width=p+'%'}};xhr.onload=async()=>{let j={};try{j=JSON.parse(xhr.responseText||'{}')}catch{}if(xhr.status>=200&&xhr.status<300){box.innerHTML=`<div class="row" style="justify-content:space-between"><b style="color:var(--green)">تم حفظ لعبة "${esc(titleText)}" بنجاح ✓</b></div>`;setTimeout(()=>box.remove(),3000);if(user&&user.role==='teacher'){try{await teacherApp()}catch{}}}else{box.innerHTML=`<div class="row" style="justify-content:space-between"><b style="color:var(--red)">تعذر حفظ لعبة "${esc(titleText)}"</b></div><div class="muted">${esc(j.error||'حدث خطأ أثناء الحفظ')}</div><button class="btn secondary" style="margin-top:8px" onclick="this.closest('.toast-card').remove()">إغلاق</button>`}};xhr.onerror=()=>{box.innerHTML=`<div class="row" style="justify-content:space-between"><b style="color:var(--red)">تعذر الاتصال أثناء حفظ لعبة "${esc(titleText)}"</b></div><button class="btn secondary" style="margin-top:8px" onclick="this.closest('.toast-card').remove()">إغلاق</button>`};xhr.send(JSON.stringify(payload))}
async function deleteVideo(id){if(!confirm('حذف الفيديو؟'))return;try{await api('/api/videos/'+id,{method:'DELETE'});await teacherApp()}catch(e){alert(e.message)}}
function videoModal(id){const v=id?data.videos.find(x=>x.id===id):{title:'',url:'',classId:data.classes[0]?.id||'',description:'',durationSeconds:0,sourceType:'url'};const bg=modal(`<div class="modal-head"><h2>${id?'تعديل الفيديو':'فيديو جديد'}</h2><button class="close" onclick="this.closest('.modal-bg').remove()">×</button></div><div class="field"><label>عنوان الفيديو</label><input id="vTitle" value="${esc(v.title)}"></div><div class="field"><label>مصدر الفيديو</label><select id="vSource" onchange="toggleVideoSource()"><option value="url" ${v.sourceType!=='upload'?'selected':''}>رابط فيديو</option><option value="upload" ${v.sourceType==='upload'?'selected':''}>رفع مباشر من الجهاز</option></select></div><div class="field" id="urlField"><label>رابط الفيديو</label><input id="vUrl" value="${esc(v.url||'')}" dir="ltr" placeholder="https://.../video.mp4"></div><div class="field hidden" id="fileField"><label>ملف الفيديو</label><input id="vFile" type="file" accept="video/*"></div><div class="field"><label>مدة الفيديو (يتم اكتشافها تلقائياً للرفع)</label><input id="vDuration" value="${esc(v.durationSeconds||0)}" type="number" min="0" placeholder="بالثواني"></div><div class="field"><label>الصف</label><select id="vClass">${data.classes.map(c=>`<option value="${c.id}" ${c.id===v.classId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>الوصف</label><textarea id="vDesc">${esc(v.description||'')}</textarea></div><div class="notice">لا يظهر للطالب زر تنزيل داخل المشغل. هذا يمنع التنزيل العادي من الواجهة، لكنه لا يستطيع متصفح الويب منع حفظ المحتوى بنسبة 100%.</div><div class="row"><button class="btn primary" id="save">حفظ</button><button class="btn secondary" onclick="this.closest('.modal-bg').remove()">إلغاء</button></div>`);toggleVideoSource();const file=$('vFile');file?.addEventListener('change',()=>{const f=file.files[0];if(!f)return;const url=URL.createObjectURL(f);const vid=document.createElement('video');vid.preload='metadata';vid.onloadedmetadata=()=>{if(Number.isFinite(vid.duration))$('vDuration').value=Math.round(vid.duration);URL.revokeObjectURL(url)};vid.src=url});bg.querySelector('#save').onclick=async()=>{try{const src=$('vSource').value;const title=$('vTitle').value.trim();if(!title)return alert('أدخل عنوان الفيديو');if(src==='upload'){const f=$('vFile').files[0];if(!f&& !id)return alert('اختر ملف الفيديو');if(f){const fd=new FormData();fd.append('title',title);fd.append('classId',$('vClass').value);fd.append('description',$('vDesc').value);fd.append('durationSeconds',$('vDuration').value||0);if(id)fd.append('existingId',id);fd.append('file',f);bg.remove();uploadVideoInBackground(fd);return;}else{const b={title,url:'',sourceType:'upload',classId:$('vClass').value,description:$('vDesc').value,durationSeconds:Number($('vDuration').value||0)};await api('/api/videos/'+id,{method:'PUT',body:JSON.stringify(b)})}}else{const b={title,url:src==='url'?$('vUrl').value:'',sourceType:src,classId:$('vClass').value,description:$('vDesc').value,durationSeconds:Number($('vDuration').value||0)};if(!b.url&&src==='url')return alert('أدخل رابط الفيديو');await api(id?'/api/videos/'+id:'/api/videos',{method:id?'PUT':'POST',body:JSON.stringify(b)})}bg.remove();await teacherApp()}catch(e){alert(e.message)}}}
function ensureToastWrap(){let w=document.getElementById('toastWrap');if(!w){w=document.createElement('div');w.id='toastWrap';w.className='toast-wrap';document.body.appendChild(w)}return w}
function uploadVideoInBackground(fd){const wrap=ensureToastWrap();const box=document.createElement('div');box.className='card toast-card';const titleText=fd.get('title')||'الفيديو';box.innerHTML=`<div class="row" style="justify-content:space-between"><b>جاري رفع "${esc(titleText)}"</b><span class="muted" data-role="pct">0%</span></div><div class="progress" style="margin-top:8px"><span data-role="bar" style="width:0%"></span></div><div class="muted" style="margin-top:6px">لا تغلق الصفحة حتى ينتهي الرفع</div>`;wrap.appendChild(box);const xhr=new XMLHttpRequest();xhr.open('POST','/api/videos/upload');xhr.setRequestHeader('Authorization','Bearer '+token);xhr.upload.onprogress=(e)=>{if(e.lengthComputable){const p=Math.round(e.loaded/e.total*100);box.querySelector('[data-role="pct"]').textContent=p+'%';box.querySelector('[data-role="bar"]').style.width=p+'%'}};xhr.onload=async()=>{let j={};try{j=JSON.parse(xhr.responseText||'{}')}catch{}if(xhr.status>=200&&xhr.status<300){box.innerHTML=`<div class="row" style="justify-content:space-between"><b style="color:var(--green)">تم رفع "${esc(titleText)}" بنجاح ✓</b></div>`;setTimeout(()=>box.remove(),3000);if(user&&user.role==='teacher'){try{await teacherApp()}catch{}}}else{box.innerHTML=`<div class="row" style="justify-content:space-between"><b style="color:var(--red)">تعذر رفع "${esc(titleText)}"</b></div><div class="muted">${esc(j.error||'حدث خطأ أثناء الرفع')}</div><button class="btn secondary" style="margin-top:8px" onclick="this.closest('.toast-card').remove()">إغلاق</button>`}};xhr.onerror=()=>{box.innerHTML=`<div class="row" style="justify-content:space-between"><b style="color:var(--red)">تعذر الاتصال أثناء رفع "${esc(titleText)}"</b></div><button class="btn secondary" style="margin-top:8px" onclick="this.closest('.toast-card').remove()">إغلاق</button>`};xhr.send(fd)}

async function openVideo(v,student){
  const restricted=user?.role!=='teacher';
  const bg=document.createElement('div'); bg.className='modal-bg';
  const src=v.sourceType==='upload'?`/video-stream/${encodeURIComponent(v.id)}?token=${encodeURIComponent(token)}`:v.url;
  bg.innerHTML=`<div class="modal game" ${restricted?'oncontextmenu="return false"':''}>
    <div class="modal-head"><div><b>${esc(v.title)}</b>${student?' · '+esc(student.name):''}</div><button class="close">×</button></div>
    <div class="video-box no-select" ${restricted?'oncontextmenu="return false"':''}>
      <video id="videoPlayer" ${restricted?'playsinline preload="metadata" disablePictureInPicture draggable="false" ondragstart="return false" oncontextmenu="return false"':'controls controlsList="nodownload noplaybackrate noremoteplayback" disablePictureInPicture playsinline draggable="false" ondragstart="return false"'} src="${esc(src)}"></video>
      ${restricted?`<div class="custom-video-controls" aria-label="عناصر تشغيل الفيديو"><button type="button" id="videoPlayBtn" class="video-control-btn" aria-label="تشغيل أو إيقاف">▶</button><input id="videoSeek" class="video-seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="تقدم الفيديو"><span id="videoTime" class="video-time">00:00 / 00:00</span><button type="button" id="videoMuteBtn" class="video-control-btn" aria-label="كتم الصوت">🔊</button></div>`:''}
    </div>
  </div>`;
  document.body.appendChild(bg);
  const video=$('videoPlayer'); let watched=0,last=0,saving=false,metadataReady=false,p;
  try{const j=await api(user.role==='student'?'/api/student/me':'/api/teacher/dashboard');p=(j.videoProgress||[]).find(x=>x.studentId===(student?.id||'')&&x.videoId===v.id)}catch{}
  const updateVideoUi=()=>{if(!restricted)return;const seek=$('videoSeek'),time=$('videoTime'),playBtn=$('videoPlayBtn'),muteBtn=$('videoMuteBtn');if(!seek||!time)return;const d=Number(video.duration)||0;seek.value=d?Math.min(100,(video.currentTime/d)*100):0;time.textContent=`${fmtSec(Math.floor(video.currentTime||0))} / ${fmtSec(Math.floor(d||0))}`;playBtn.textContent=video.paused?'▶':'⏸';muteBtn.textContent=video.muted?'🔇':'🔊'};
  const applyResume=()=>{metadataReady=true;if(p){watched=Math.max(0,Number(p.watchedSeconds||0));const resume=Math.min(Number(p.lastPositionSeconds||0),Number(video.duration||p.durationSeconds||0));if(Number.isFinite(resume)&&resume>0)video.currentTime=resume}updateVideoUi()};
  const persist=async(ev)=>{if(!student||saving)return;saving=true;try{await api('/api/video-progress',{method:'POST',body:JSON.stringify({videoId:v.id,event:ev,durationSeconds:Number(video.duration||v.durationSeconds||0),watchedSeconds:Math.round(watched),positionSeconds:Math.round(video.currentTime)})})}catch{}finally{saving=false}};
  video.addEventListener('loadedmetadata',applyResume,{once:true}); video.addEventListener('durationchange',()=>{if(!metadataReady&&Number(video.duration)>0)applyResume()});
  video.onplay=()=>{last=video.currentTime;if(student)persist('play');updateVideoUi()}; video.onpause=()=>{if(student)persist('pause');updateVideoUi()}; video.onseeking=()=>{last=video.currentTime;updateVideoUi()}; video.onseeked=()=>{last=video.currentTime;updateVideoUi()};
  video.onended=()=>{watched=Math.max(watched,video.duration||0);last=video.duration||last;persist('ended');updateVideoUi()};
  video.ontimeupdate=()=>{const cur=video.currentTime,d=cur-last;if(!video.paused&&d>=0&&d<=1.5)watched+=d;last=cur;updateVideoUi();if(student&&!saving&&Math.floor(watched)%10===0)persist('progress')};
  if(restricted){$('videoPlayBtn').onclick=()=>video.paused?video.play():video.pause();$('videoSeek').oninput=()=>{if(Number(video.duration)>0)video.currentTime=(Number($('videoSeek').value)/100)*video.duration};$('videoMuteBtn').onclick=()=>{video.muted=!video.muted;updateVideoUi()};video.addEventListener('volumechange',updateVideoUi);updateVideoUi()}
  bg.querySelector('.close').onclick=async()=>{await persist('pause');bg.remove()};
  if(student){try{await api('/api/video-progress',{method:'POST',body:JSON.stringify({videoId:v.id,event:'open',durationSeconds:v.durationSeconds||0,watchedSeconds:watched,positionSeconds:Number(p?.lastPositionSeconds||0)})})}catch{}}
}

async function studentApp(){const j=await api('/api/student/me');const st=j.student;const vmap=Object.fromEntries((j.videoProgress||[]).map(p=>[p.videoId,p]));$('app').innerHTML=`<div class="app"><aside class="side"><div class="brand"><b>منصّة الدروس</b><small>حساب الطالب</small></div><div class="nav"><button class="active"><span class="i">🎮</span><span>ألعابي</span></button><button onclick="logout()"><span class="i">↩</span><span>خروج</span></button></div></aside><main class="main">${teacherHeader('مرحباً '+esc(st.name),'الصف: '+esc(j.class.name),`<span class="pill">حساب طالب</span>`)}<div class="hero"><h2>أهلاً ${esc(st.name)} 👋</h2><p>شاهد الفيديوهات والعب الألعاب والاختبارات المتاحة لك. المتابعة تسجل فقط عند بدء نشاط تعليمي فعلي.</p></div><div class="grid">${j.games.length?j.games.map(g=>`<button class="click-card" onclick='openGame(${JSON.stringify(g)},${JSON.stringify(st)})'><div class="stat"><div style="font-size:32px">🎮</div><div><b>${esc(g.title)}</b><div class="muted">${esc(g.description||'لعبة تعليمية')}</div></div><span style="margin-right:auto">▶</span></div></button>`).join(''):`<div class="empty card">لا توجد ألعاب متاحة لك.</div>`}</div><div class="section card"><div class="section-head"><h2>الفيديوهات</h2><span class="badge green">مشاهدة فقط</span></div>${j.videos?.length?`<div class="grid">${j.videos.map(v=>{const p=vmap[v.id];const pr=pct(p?.watchedSeconds||0,p?.durationSeconds||v.durationSeconds||0);return `<button class="click-card" onclick='openVideo(${JSON.stringify(v)},${JSON.stringify(st)})'><div class="stat"><div style="font-size:30px">▶️</div><div style="flex:1"><b>${esc(v.title)}</b><div class="muted">المدة: ${fmtSec(v.durationSeconds)}</div><div class="muted">شاهد: ${fmtSec(p?.watchedSeconds||0)} · ${pr}%</div><div class="progress-wrap"><div class="progress"><span style="width:${pr}%"></span></div></div></div><span>▶</span></div></button>`}).join('')}</div>`:`<div class="empty">لا توجد فيديوهات متاحة لك.</div>`}</div><div class="section card"><div class="section-head"><h2>الاختبارات الإلكترونية</h2></div>${j.tests?.length?`<div class="grid">${j.tests.map(t=>`<button class="click-card" onclick='openTest(${JSON.stringify(t)},true)'><div class="stat"><div style="font-size:30px">📝</div><div><b>${esc(t.title)}</b><div class="muted">${esc(t.description||'اختبار إلكتروني')}</div></div><span>▶</span></div></button>`).join('')}</div>`:`<div class="empty">لا توجد اختبارات متاحة لك.</div>`}</div><div class="section card"><h2>نتائجي</h2>${j.results.length?`<div class="table-wrap"><table class="table"><tr><th>النوع</th><th>النشاط</th><th>الدرجة</th><th>النسبة</th><th>التاريخ</th></tr>${j.results.map(r=>`<tr><td>${r.resultType==='test'?'اختبار إلكتروني':'لعبة'}</td><td>${esc(r.title||r.gameTitle||r.testTitle||'—')}</td><td>${r.score}/${r.total}</td><td><span class="badge ${r.percentage>=50?'green':'red'}">${r.percentage}%</span></td><td>${new Date(r.createdAt).toLocaleString('ar-EG')}</td></tr>`).join('')}</table></div>`:`<div class="empty">لم تسجل نتائج بعد.</div>`}</div></main></div>`;document.body.oncontextmenu=e=>e.preventDefault();document.body.oncopy=e=>e.preventDefault()}
async function studentMonitor(id){const r=await api('/api/teacher/students/'+id+'/report');const st=r.student;const pmap=Object.fromEntries((r.videoProgress||[]).map(p=>[p.videoId,p]));const latestGame={};const latestTest={};(r.results||[]).forEach(x=>{if(x.resultType==='test'){if(!latestTest[x.testId])latestTest[x.testId]=x}else{if(!latestGame[x.gameId])latestGame[x.gameId]=x}});const avg=arr=>arr.length?Math.round(arr.reduce((a,b)=>a+b.percentage,0)/arr.length):null;const gamesAvg=avg((r.results||[]).filter(x=>x.resultType!=='test'));const testsAvg=avg((r.results||[]).filter(x=>x.resultType==='test'));const bg=modal(`<div class="modal"><div class="modal-head"><h2>متابعة ${esc(st.name)}</h2><button class="close" onclick="this.closest('.modal-bg').remove()">×</button></div><div class="detail-grid"><div class="metric"><span class="muted">الصف</span><b>${esc(r.class.name)}</b></div><div class="metric"><span class="muted">الألعاب التي دخلها</span><b>${r.games.length}</b></div><div class="metric"><span class="muted">متوسط نسبة الألعاب</span><b>${gamesAvg===null?"—":gamesAvg+"%"}</b></div><div class="metric"><span class="muted">الاختبارات التي دخلها</span><b>${(r.tests||[]).length}</b></div><div class="metric"><span class="muted">متوسط نسبة الاختبارات</span><b>${testsAvg===null?"—":testsAvg+"%"}</b></div><div class="metric"><span class="muted">النتائج المسجلة</span><b>${r.results.length}</b></div></div><div class="section card"><h3>الفيديوهات</h3>${r.videos.length?`<div class="table-wrap"><table class="table"><tr><th>الفيديو</th><th>المدة</th><th>شاهد الطالب</th><th>النسبة</th><th>الحالة</th></tr>${r.videos.map(v=>{const p=pmap[v.id];const pr=pct(p?.watchedSeconds||0,p?.durationSeconds||v.durationSeconds||0);return `<tr><td>${esc(v.title)}</td><td>${fmtSec(p?.durationSeconds||v.durationSeconds)}</td><td>${fmtSec(p?.watchedSeconds||0)}</td><td>${pr}%</td><td>${p?.completed?'مكتمل':p?.watchedSeconds>0?'بدأ ولم يكمل':'لم يبدأ'}</td></tr>`}).join('')}</table></div>`:`<div class="empty">لا توجد فيديوهات للصف.</div>`}</div><div class="section card"><div class="section-head"><h3>الألعاب التي دخلها الطالب</h3><button class="btn secondary" onclick="manualGradeModal('${st.id}','game')">＋ تسجيل درجة</button></div>${r.games.length?`<div class="table-wrap"><table class="table"><tr><th>اللعبة</th><th>النتيجة</th><th>النسبة</th><th>الحالة</th><th>إجراء</th></tr>${r.games.map(g=>{const z=latestGame[g.id];return `<tr><td>${esc(g.title)}</td><td>${z?z.score+'/'+z.total:'—'}</td><td>${z?z.percentage+'%':'—'}</td><td>${z?'أنهى وسجل النتيجة':'دخل ولم يسجل نتيجة'}</td><td><button class="btn secondary" onclick="manualGradeModal('${st.id}','game','${g.id}')">تسجيل درجة</button></td></tr>`}).join('')}</table></div>`:`<div class="empty">لم يدخل ألعاباً بعد.</div>`}</div><div class="section card"><div class="section-head"><h3>الاختبارات الإلكترونية</h3><button class="btn secondary" onclick="manualGradeModal('${st.id}','test')">＋ تسجيل درجة</button></div>${(r.tests||[]).length?`<div class="table-wrap"><table class="table"><tr><th>الاختبار</th><th>النتيجة</th><th>النسبة</th><th>الحالة</th><th>إجراء</th></tr>${r.tests.map(t=>{const z=latestTest[t.id];return `<tr><td>${esc(t.title)}</td><td>${z?z.score+'/'+z.total:'—'}</td><td>${z?z.percentage+'%':'—'}</td><td>${z?'أنهى وسجل النتيجة':'دخل ولم يسجل نتيجة'}</td><td><button class="btn secondary" onclick="manualGradeModal('${st.id}','test','${t.id}')">تسجيل درجة</button></td></tr>`}).join('')}</table></div>`:`<div class="empty">لم يدخل اختبارات إلكترونية بعد.</div>`}</div><div class="section card"><h3>آخر النشاط التعليمي</h3>${r.activities.length?r.activities.slice(0,30).map(a=>`<div class="activity"><b>${esc(a.title||a.type)}</b><div class="muted">${a.type==='video_progress'||a.type==='video_completed'?'مشاهدة فيديو · '+fmtSec(a.watchedSeconds||0)+' من '+fmtSec(a.durationSeconds||0):a.type==='game_open'?'دخل لعبة':a.type==='test_open'?'دخل اختبار إلكتروني':'نشاط تعليمي'} · ${new Date(a.createdAt).toLocaleString('ar-EG')}</div></div>`).join(''):`<div class="empty">لا يوجد نشاط تعليمي مسجل.</div>`}</div></div>`)}

async function parentApp(){const j=await api('/api/parent/me');const st=j.student;const vmap=Object.fromEntries((j.videoProgress||[]).map(p=>[p.videoId,p]));const enteredGames=j.games||[];const enteredTests=j.tests||[];const latestGame={};const latestTest={};j.results.forEach(r=>{if(r.resultType==='test'){if(!latestTest[r.testId])latestTest[r.testId]=r}else{if(!latestGame[r.gameId])latestGame[r.gameId]=r}});const avg=arr=>arr.length?Math.round(arr.reduce((a,b)=>a+b.percentage,0)/arr.length):null;const gamesAvg=avg(j.results.filter(r=>r.resultType!=="test"));const testsAvg=avg(j.results.filter(r=>r.resultType==="test"));$('app').innerHTML=`<div class="app"><aside class="side"><div class="brand"><b>منصّة الدروس</b><small>متابعة ولي الأمر</small></div><div class="nav"><button class="active"><span class="i">📊</span><span>متابعة الطالب</span></button><button onclick="logout()"><span class="i">↩</span><span>خروج</span></button></div></aside><main class="main">${teacherHeader('متابعة '+esc(st.name),'الصف: '+esc(j.class.name),`<span class="pill">ولي الأمر</span>`)}<div class="grid"><button class="click-card" onclick="showParentDetail('games')"><div class="stat"><div style="font-size:32px">🎮</div><div><div class="big">${enteredGames.length}</div><div class="muted">الألعاب التي دخل عليها الطالب</div>${gamesAvg===null?"":`<span class="badge ${gamesAvg>=50?"green":"red"}" style="margin-top:6px">مستوى الطالب: ${gamesAvg}%</span>`}</div><span>‹</span></div></button><button class="click-card" onclick="showParentDetail('tests')"><div class="stat"><div style="font-size:32px">📝</div><div><div class="big">${enteredTests.length}</div><div class="muted">الاختبارات التي دخل عليها الطالب</div>${testsAvg===null?"":`<span class="badge ${testsAvg>=50?"green":"red"}" style="margin-top:6px">مستوى الطالب: ${testsAvg}%</span>`}</div><span>‹</span></div></button><button class="click-card" onclick="showParentDetail('videos')"><div class="stat"><div style="font-size:32px">🎥</div><div><div class="big">${(j.videoProgress||[]).filter(p=>p.watchedSeconds>0).length}</div><div class="muted">الفيديوهات التي بدأها الطالب</div></div><span>‹</span></div></button>${portalStat('عدد النتائج',j.results.length,'🏆')}</div><div id="parentDetail" class="section"></div></main></div>`;document.body.oncontextmenu=e=>e.preventDefault();document.body.oncopy=e=>e.preventDefault();window.parentData={j,st,vmap,enteredGames,enteredTests,latestGame,latestTest};showParentDetail('games')}
function showParentDetail(kind){const d=window.parentData;if(!d)return;const {j,vmap,enteredGames,enteredTests,latestGame,latestTest}=d;const el=$('parentDetail');if(kind==='games'){el.innerHTML=`<div class="card"><div class="section-head"><h2>الألعاب التي دخل عليها الطالب</h2><span class="badge green">${enteredGames.length}</span></div>${enteredGames.length?`<div class="table-wrap"><table class="table"><tr><th>اللعبة</th><th>الدرجة</th><th>النسبة</th><th>الحالة</th><th>آخر نتيجة</th></tr>${enteredGames.map(g=>{const r=latestGame[g.id];return `<tr><td><b>${esc(g.title)}</b></td><td>${r?r.score+'/'+r.total:'—'}</td><td>${r?`<span class="badge ${r.percentage>=50?'green':'red'}">${r.percentage}%</span>`:'—'}</td><td>${r?'أنهى اللعبة وسجل النتيجة':'دخل اللعبة ولم يسجل نتيجة'}</td><td>${r?new Date(r.createdAt).toLocaleString('ar-EG'):'—'}</td></tr>`}).join('')}</table></div>`:`<div class="empty">لم يدخل الطالب أي لعبة حتى الآن.</div>`}</div>`}else if(kind==='tests'){el.innerHTML=`<div class="card"><div class="section-head"><h2>الاختبارات الإلكترونية التي دخل عليها الطالب</h2><span class="badge green">${enteredTests.length}</span></div>${enteredTests.length?`<div class="table-wrap"><table class="table"><tr><th>الاختبار</th><th>الدرجة</th><th>النسبة</th><th>الحالة</th><th>آخر نتيجة</th></tr>${enteredTests.map(t=>{const r=latestTest[t.id];return `<tr><td><b>${esc(t.title)}</b></td><td>${r?r.score+'/'+r.total:'—'}</td><td>${r?`<span class="badge ${r.percentage>=50?'green':'red'}">${r.percentage}%</span>`:'—'}</td><td>${r?'أنهى الاختبار وسجل النتيجة':'دخل الاختبار ولم يسجل نتيجة'}</td><td>${r?new Date(r.createdAt).toLocaleString('ar-EG'):'—'}</td></tr>`}).join('')}</table></div>`:`<div class="empty">لم يدخل الطالب أي اختبار حتى الآن.</div>`}</div>`}else{const started=(j.videos||[]).filter(v=>(vmap[v.id]?.watchedSeconds||0)>0);el.innerHTML=`<div class="card"><div class="section-head"><h2>الفيديوهات التي بدأها الطالب</h2><span class="badge green">${started.length}</span></div>${started.length?`<div class="table-wrap"><table class="table"><tr><th>الفيديو</th><th>مدة الفيديو</th><th>شاهد الطالب</th><th>النسبة</th><th>الحالة</th><th>آخر مشاهدة</th></tr>${started.map(v=>{const p=vmap[v.id];const pr=pct(p.watchedSeconds,p.durationSeconds||v.durationSeconds);return `<tr><td><b>${esc(v.title)}</b></td><td>${fmtSec(p.durationSeconds||v.durationSeconds)}</td><td>${fmtSec(p.watchedSeconds)}</td><td>${pr}%</td><td>${p.completed?'مكتمل':'قيد المتابعة'}</td><td>${p.lastWatchedAt?new Date(p.lastWatchedAt).toLocaleString('ar-EG'):'—'}</td></tr>`}).join('')}</table></div>`:`<div class="empty">لم يبدأ الطالب أي فيديو حتى الآن.</div>`}</div>`}}
boot();
</script>
